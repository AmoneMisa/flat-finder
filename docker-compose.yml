services:
  flat-finder-backend:
    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      - REDIS_URL=redis://flat-finder-redis:6379

      - PGHOST=flat-finder-postgres
      - PGPORT=5432

      - ELASTICSEARCH_URL=http://flat-finder-elasticsearch:9200
      - ELASTICSEARCH_INDEX=flat-listings-v1

      - AI_WORKER_URL=http://ai-worker:4030

      - OLX_FETCHER_URL=http://flat-finder-olx-fetcher:4020

    depends_on:
      flat-finder-redis:
        condition: service_healthy

      flat-finder-postgres:
        condition: service_healthy

      flat-finder-elasticsearch:
        condition: service_healthy

      flat-finder-olx-fetcher:
        condition: service_started

    ports:
      - "127.0.0.1:4000:4000"

    networks:
      - default
      - ai-net

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flat-finder-olx-fetcher:
    build:
      context: ./olx-fetcher

    restart: unless-stopped

    expose:
      - "4020"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4020/health',timeout=3).status==200 else 1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flat-finder-redis:
    image: redis:8-alpine

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        ""
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  flat-finder-postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - ./.env

    volumes:
      - flat-finder-postgres-data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  flat-finder-elasticsearch:
    build:
      context: ./elasticsearch

    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    volumes:
      - flat-finder-elasticsearch-data:/usr/share/elasticsearch/data

    expose:
      - "9200"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 40s

volumes:
  flat-finder-postgres-data:
  flat-finder-elasticsearch-data:

networks:
  ai-net:
    external: true