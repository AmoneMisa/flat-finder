services:
  flat-finder-backend:
    image: ghcr.io/amonemisa/flat-finder-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://flat-finder-redis:6379
      - PGHOST=flat-finder-postgres
      - PGPORT=5432
      - ELASTICSEARCH_URL=http://flat-finder-elasticsearch:9200
      - ELASTICSEARCH_INDEX=flat-listings-v1
      - AI_WORKER_URL=http://ai-worker:4030
      - OLX_FETCHER_URL=http://flat-finder-olx-router:4021
      - SOCIAL_FETCHER_URL=http://flat-finder-social-fetcher:4040
      - OLX_UA_CITIES_PER_RUN=${OLX_UA_CITIES_PER_RUN:-40}
      - OLX_UA_CITY_MAX_PAGES=${OLX_UA_CITY_MAX_PAGES:-1000}
      - OLX_UA_CITY_BUDGET_MS=${OLX_UA_CITY_BUDGET_MS:-600000}
      - SOURCE_DEADLINE_MS=${SOURCE_DEADLINE_MS:-7200000}
      - PHOTO_CACHE_DIR=/var/cache/flat-photos
      - PHOTO_CACHE_MAX_MB=${PHOTO_CACHE_MAX_MB:-512}
    volumes:
      - flat-finder-photo-cache:/var/cache/flat-photos
    depends_on:
      flat-finder-redis:
        condition: service_healthy
      flat-finder-postgres:
        condition: service_healthy
      flat-finder-elasticsearch:
        condition: service_healthy
      flat-finder-olx-router:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - default
      - ai-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flat-finder-queue-task-api:
    image: ghcr.io/amonemisa/flat-finder-backend:${IMAGE_TAG:-latest}
    command: ["node", "src/queue-task-server.js"]
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://flat-finder-redis:6379
      - PGHOST=flat-finder-postgres
      - PGPORT=5432
      - ELASTICSEARCH_URL=http://flat-finder-elasticsearch:9200
      - ELASTICSEARCH_INDEX=flat-listings-v1
      - OLX_FETCHER_URL=http://flat-finder-olx-router:4021
      - OLX_FETCHER_URL_0=http://flat-finder-olx-fetcher:4020
      - OLX_FETCHER_URL_1=http://flat-finder-olx-fetcher-ua:4020
      - OLX_UA_CITIES_PER_RUN=${OLX_UA_CITIES_PER_RUN:-40}
      - OLX_UA_CITY_MAX_PAGES=${OLX_UA_CITY_MAX_PAGES:-1000}
      - OLX_UA_CITY_BUDGET_MS=${OLX_UA_CITY_BUDGET_MS:-600000}
      - SOURCE_DEADLINE_MS=${SOURCE_DEADLINE_MS:-7200000}
      - QUEUE_TASK_PORT=4010
      - QUEUE_INTERNAL_KEY=${QUEUE_INTERNAL_KEY}
      - QUEUE_PROTOCOL_VERSION=${QUEUE_PROTOCOL_VERSION:-3}
      - QUEUE_SHARDS=${QUEUE_SHARDS:-2}
    expose:
      - "4010"
    networks:
      - default
      - ai-net
    depends_on:
      flat-finder-redis:
        condition: service_healthy
      flat-finder-postgres:
        condition: service_healthy
      flat-finder-elasticsearch:
        condition: service_healthy
      flat-finder-olx-fetcher:
        condition: service_healthy
      flat-finder-olx-fetcher-ua:
        condition: service_healthy
      flat-finder-olx-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  flat-finder-rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crawler}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-crawler}
    volumes:
      - flat-finder-rabbitmq-data:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
    networks:
      - default
      - ai-net
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
      start_interval: 5s

  flat-finder-queue-dispatcher:
    image: ghcr.io/amonemisa/flat-finder-queue-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      QUEUE_MODE: dispatcher
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler}@flat-finder-rabbitmq:5672/%2F
      QUEUE_TASK_API_URL: http://flat-finder-queue-task-api:4010
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY}
      QUEUE_REFRESH_SECONDS: ${QUEUE_REFRESH_SECONDS:-1800}
      QUEUE_PROTOCOL_VERSION: ${QUEUE_PROTOCOL_VERSION:-3}
      QUEUE_SHARDS: ${QUEUE_SHARDS:-2}
    depends_on:
      flat-finder-rabbitmq:
        condition: service_healthy
      flat-finder-queue-task-api:
        condition: service_healthy

  flat-finder-queue-worker-1:
    image: ghcr.io/amonemisa/flat-finder-queue-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      QUEUE_MODE: worker
      QUEUE_WORKER_ROLE: olx
      QUEUE_SHARD: 0
      QUEUE_SHARDS: ${QUEUE_SHARDS:-2}
      QUEUE_PROTOCOL_VERSION: ${QUEUE_PROTOCOL_VERSION:-3}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler}@flat-finder-rabbitmq:5672/%2F
      QUEUE_TASK_API_URL: http://flat-finder-queue-task-api:4010
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY}
      QUEUE_PREFETCH: ${QUEUE_PREFETCH:-1}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
    depends_on:
      flat-finder-rabbitmq:
        condition: service_healthy
      flat-finder-queue-task-api:
        condition: service_healthy

  flat-finder-queue-worker-2:
    image: ghcr.io/amonemisa/flat-finder-queue-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      QUEUE_MODE: worker
      QUEUE_WORKER_ROLE: olx
      QUEUE_SHARD: 1
      QUEUE_SHARDS: ${QUEUE_SHARDS:-2}
      QUEUE_PROTOCOL_VERSION: ${QUEUE_PROTOCOL_VERSION:-3}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler}@flat-finder-rabbitmq:5672/%2F
      QUEUE_TASK_API_URL: http://flat-finder-queue-task-api:4010
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY}
      QUEUE_PREFETCH: ${QUEUE_PREFETCH:-1}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
    depends_on:
      flat-finder-rabbitmq:
        condition: service_healthy
      flat-finder-queue-task-api:
        condition: service_healthy

  flat-finder-queue-worker-telegram:
    image: ghcr.io/amonemisa/flat-finder-queue-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${TELEGRAM_WORKER_MEMORY_LIMIT:-256m}
    environment:
      QUEUE_MODE: worker
      QUEUE_WORKER_ROLE: telegram
      QUEUE_SHARDS: ${QUEUE_SHARDS:-2}
      QUEUE_PROTOCOL_VERSION: ${QUEUE_PROTOCOL_VERSION:-3}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler}@flat-finder-rabbitmq:5672/%2F
      QUEUE_TASK_API_URL: http://flat-finder-queue-task-api:4010
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY}
      QUEUE_PREFETCH: 1
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
    depends_on:
      flat-finder-rabbitmq:
        condition: service_healthy
      flat-finder-queue-task-api:
        condition: service_healthy

  flat-finder-olx-fetcher:
    image: ghcr.io/amonemisa/flat-finder-olx-fetcher:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - OLX_TIMEOUT=45
      - OLX_ATTEMPTS=${OLX_ATTEMPTS:-1}
      - OLX_LOOKBACK_DAYS=${OLX_LOOKBACK_DAYS:-21}
    expose:
      - "4020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4020/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flat-finder-olx-fetcher-ua:
    image: ghcr.io/amonemisa/flat-finder-olx-fetcher:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - OLX_TIMEOUT=45
      - OLX_ATTEMPTS=${OLX_ATTEMPTS:-1}
      - OLX_LOOKBACK_DAYS=${OLX_LOOKBACK_DAYS:-21}
    expose:
      - "4020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4020/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flat-finder-olx-router:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./olx-router/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "4021"
    depends_on:
      flat-finder-olx-fetcher:
        condition: service_healthy
      flat-finder-olx-fetcher-ua:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://localhost:4021/health' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  flat-finder-social-fetcher:
    image: ghcr.io/amonemisa/flat-finder-social-fetcher:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - SOCIAL_MAX_ITEMS=${SOCIAL_MAX_ITEMS:-100}
      - SOCIAL_HTTP_TIMEOUT=${SOCIAL_HTTP_TIMEOUT:-30}
      - SOCIAL_BROWSER_TIMEOUT_MS=${SOCIAL_BROWSER_TIMEOUT_MS:-45000}
      - SOCIAL_BROWSER_CONCURRENCY=${SOCIAL_BROWSER_CONCURRENCY:-1}
      - THREADS_SCROLLS=${THREADS_SCROLLS:-8}
      - LINKEDIN_MAX_DETAIL_FETCHES=${LINKEDIN_MAX_DETAIL_FETCHES:-15}
      - SOCIAL_IMPERSONATE=${SOCIAL_IMPERSONATE:-chrome124}
    expose:
      - "4040"
    shm_size: ${SOCIAL_SHM_SIZE:-256mb}
    mem_limit: ${SOCIAL_WORKER_MEMORY_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4040/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  flat-finder-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  flat-finder-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - flat-finder-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - default
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  flat-finder-elasticsearch:
    image: ghcr.io/amonemisa/flat-finder-elasticsearch:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - /mnt/docker-data/elasticsearch-data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      - default
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
      start_interval: 5s

volumes:
  flat-finder-postgres-data:
  flat-finder-rabbitmq-data:
  flat-finder-photo-cache:

networks:
  ai-net:
    external: true
