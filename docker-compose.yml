services:
  flat-finder-backend:
    build:
      context: ./backend
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      - REDIS_URL=redis://flat-finder-redis:6379

      # PostgreSQL lives inside the compose network.
      - PGHOST=flat-finder-postgres
      - PGPORT=5432

      # Private shared enrichment service.
      - AI_WORKER_URL=http://ai-worker:4030

      # OLX curl_cffi sidecar.
      - OLX_FETCHER_URL=http://flat-finder-olx-fetcher:4020

    depends_on:
      flat-finder-redis:
        condition: service_healthy

      flat-finder-postgres:
        condition: service_healthy

      flat-finder-olx-fetcher:
        condition: service_started

    ports:
      - "127.0.0.1:4000:4000"

    networks:
      - default
      - ai-net

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  flat-finder-olx-fetcher:
    build:
      context: ./olx-fetcher

    restart: unless-stopped

    expose:
      - "4020"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4020/health',timeout=3).status==200 else 1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flat-finder-redis:
    image: redis:8-alpine

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        ""
      ]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  flat-finder-postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - ./.env

    volumes:
      - flat-finder-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    # Наружу PostgreSQL не публикуем.
    # Backend ходит сюда через docker network.
    expose:
      - "5432"

volumes:
  flat-finder-postgres-data:

networks:
  ai-net:
    external: true