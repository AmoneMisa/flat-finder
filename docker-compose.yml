services:
  flat-finder-backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./flatfinder.env
    # No published ports: only the nginx service (same compose network) reaches it.
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  flat-finder-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.flatfinder.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flat-finder-backend
