services:
  flat-finder-backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./flatfinder.env
    # Shared listing cache. Falls back to in-memory automatically if this is
    # unreachable, so the backend still boots even when Redis is down.
    environment:
      - REDIS_URL=redis://flat-finder-redis:6379
      # OLX is fetched through the curl_cffi sidecar (OLX's WAF 403s plain HTTP
      # clients from our server). If this is unreachable the OLX source just
      # yields nothing (other sources still work) — not hard-coupled.
      - OLX_FETCHER_URL=http://flat-finder-olx-fetcher:4020
      # Telegram MTProto sidecar URL comes from flatfinder.env (TG_WORKER_URL).
      # It points either at the in-compose worker (http://flat-finder-tg-worker:4100)
      # or, while the server can't reach Telegram's DCs, at the PC Cloudflare tunnel.
      # If unset/unreachable the telegram source just yields nothing (OLX etc. still
      # work), so the backend is not hard-coupled.
    depends_on:
      flat-finder-redis:
        condition: service_healthy
      # Ordering only (service_started, not _healthy): OLX failing must not block
      # the backend from serving the other sources.
      flat-finder-olx-fetcher:
        condition: service_started
    # Loopback-only, like the other project's 8080/8081 services. The host's
    # existing nginx reverse-proxies to this port.
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Chrome-TLS-impersonating fetch sidecar for OLX (see backend/src/scrapers/olx.js).
  flat-finder-olx-fetcher:
    build:
      context: ./olx-fetcher
    restart: unless-stopped
    # Optional overrides (defaults in app.py): OLX_IMPERSONATE, OLX_TIMEOUT.
    # environment:
    #   - OLX_IMPERSONATE=chrome124
    # Internal only — reached by the backend over the compose network.
    expose:
      - "4020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4020/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flat-finder-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache-only: cap memory and evict least-recently-used keys instead of
    # erroring when full. No persistence needed — the scraper repopulates it.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
