name: flat_finder
description: Flat & house search across RO, UA, KZ, UZ, KG with a map and filters.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.5
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
