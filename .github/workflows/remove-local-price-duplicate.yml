name: Remove local price parser duplicate

on:
  push:
    branches:
      - fix/location-price-regressions

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-price-regressions
      - name: Remove local price implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          textparse = Path('backend/src/textparse.js')
          text = textparse.read_text()
          start = text.index('const CURRENCY_WORDS = [')
          end = text.index('const ok10 =')
          shared = "export {parseHousingPriceFromText as parsePriceFromText} from '@whiteslove/parsing-lexicon/housing-money';\n\n"
          textparse.write_text(text[:start] + shared + text[end:])

          telegram = Path('backend/src/scrapers/telegram.js')
          text = telegram.read_text()
          text = text.replace("import {parseListingPriceFromText} from '../price-parse.js';\n", '')
          text = text.replace("import {\n  parseRoomsFromText,", "import {\n  parsePriceFromText,\n  parseRoomsFromText,")
          text = text.replace('const parsed = parseListingPriceFromText(text, fallbackCurrency);', 'const parsed = parsePriceFromText(text, fallbackCurrency);')
          telegram.write_text(text)

          test = Path('backend/test/location-price-regressions.test.js')
          text = test.read_text()
          text = text.replace("import {parseListingPriceFromText, stripPhoneLikePriceCandidates} from '../src/price-parse.js';", "import {maskPhoneLikeSpans} from '@whiteslove/parsing-lexicon/contact';\nimport {parseHousingPriceFromText} from '@whiteslove/parsing-lexicon/housing-money';")
          text = text.replace('stripPhoneLikePriceCandidates(wantedChernivtsi)', 'maskPhoneLikeSpans(wantedChernivtsi)')
          text = text.replace("parseListingPriceFromText(wantedChernivtsi, 'UAH')", "parseHousingPriceFromText(wantedChernivtsi, 'UAH')")
          test.write_text(text)

          Path('backend/src/price-parse.js').unlink()
          PY
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/textparse.js backend/src/scrapers/telegram.js backend/test/location-price-regressions.test.js backend/src/price-parse.js
          git commit -m "Remove local housing price parser duplicate"
          git push origin HEAD:fix/location-price-regressions
