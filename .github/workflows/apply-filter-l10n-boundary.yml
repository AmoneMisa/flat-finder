name: Apply filter and l10n boundary fixes

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-filter-l10n-boundary.py'
      - '.github/workflows/apply-filter-l10n-boundary.yml'

permissions:
  contents: write

concurrency:
  group: apply-filter-l10n-boundary
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - run: python .github/scripts/apply-filter-l10n-boundary.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib app/test
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(app): make filter searches explicit'
          git push origin HEAD:develop
