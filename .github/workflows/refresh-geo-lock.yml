name: Finish geo centralization

on:
  push:
    branches:
      - fix/backend-ci-geo-centralization

permissions:
  contents: write

jobs:
  finish-geo:
    if: ${{ !contains(github.event.head_commit.message, '[geo-finish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-ci-geo-centralization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove last local Tashkent transit lexeme
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/location-dictionary-resolver.js')
          text = path.read_text()
          import_line = "import { matchTashkentHousingTransit } from '@whiteslove/parsing-lexicon/tashkent-housing-geography';\n"
          marker = "} from '@whiteslove/parsing-lexicon';\n"
          if import_line not in text:
              text = text.replace(marker, marker + import_line, 1)

          start_marker = "    if (\n      entry.name === 'Toshkent' &&\n"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index("\n\n    matches.push", start)
              replacement = "    if (entry.name === 'Toshkent' && matchTashkentHousingTransit(value.slice(start, end + 64))) continue;"
              text = text[:start] + replacement + text[end:]

          path.write_text(text)
          PY
      - name: Refresh package lock
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated changes
        run: |
          if git diff --quiet -- backend/src/location-dictionary-resolver.js backend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/location-dictionary-resolver.js backend/package-lock.json
          git commit -m "refactor(geo): remove final local Tashkent transit lexeme [geo-finish]"
          git push
