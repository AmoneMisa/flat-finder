name: Refresh geo dependency lock

on:
  push:
    branches:
      - fix/backend-ci-geo-centralization

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-ci-geo-centralization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh package lock
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore(deps): refresh parsing lexicon lock [lock-refresh]"
          git push
