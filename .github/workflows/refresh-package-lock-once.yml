name: Refresh parsing package lock once

on:
  push:
    branches:
      - fix/location-price-regressions

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-price-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json
          git commit -m "Refresh parsing package lock" || exit 0
          git push origin HEAD:fix/location-price-regressions
