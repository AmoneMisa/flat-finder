name: Verify flat-finder backend PR

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'docs/PERFORMANCE_AUDIT_PLAN.md'
      - '.github/workflows/backend-pr.yml'

permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flatfinder
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: flatfinder
      POSTGRES_USER: flatfinder
      POSTGRES_PASSWORD: flatfinder-test
      TEST_POSTGRES_URL: postgresql://flatfinder:flatfinder-test@127.0.0.1:5432/flatfinder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Check backend syntax
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Apply database migrations
        run: npm run migrate --prefix backend

      - name: Run PostgreSQL integration regressions
        env:
          TEST_POSTGRES_SEARCH: '1'
        run: >-
          node --test
          backend/test/pg-queue.integration.test.js
          backend/test/postgres-search.integration.test.js
          backend/test/market-comparison.integration.test.js
          backend/test/filter-parity.integration.test.js
          backend/test/availability.integration.test.js
          backend/test/availability-force.integration.test.js
          backend/test/listing-item-availability.test.js
          backend/test/queue-crawl-stability.test.js
          backend/test/social-housing-lifecycle.test.js
          backend/test/social-fetch-contracts.test.js
          backend/test/performance-hardening.integration.test.js

      - name: Run full backend suite
        run: npm test --prefix backend
