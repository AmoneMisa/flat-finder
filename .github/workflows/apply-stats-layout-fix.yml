name: Apply stats layout fix

on:
  push:
    branches: [ master ]
    paths:
      - .github/scripts/apply-stats-layout-fix.py
      - .github/workflows/apply-stats-layout-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply-stats-layout-fix.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Verify Flutter
        working-directory: app
        run: |
          flutter pub get
          dart format lib/widgets/stats_sheet.dart lib/l10n/strings.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-stats-layout-fix.py .github/workflows/apply-stats-layout-fix.yml
          git add app/lib/widgets/stats_sheet.dart app/lib/l10n/strings.dart
          git diff --cached --check
          git commit -m "fix(app): align statistics controls and metrics"
          git push origin master
