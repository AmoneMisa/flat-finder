name: Apply mobile map and review fixes

on:
  push:
    branches: [ master ]
    paths:
      - '.github/scripts/apply-mobile-map-review-fixes.py'
      - '.github/workflows/apply-mobile-map-review-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        run: python .github/scripts/apply-mobile-map-review-fixes.py

      - name: Commit patched app files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/screens/home_screen.dart app/lib/widgets/map_view.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(app): keep map usable and stabilize review flow'
          git push origin HEAD:master
