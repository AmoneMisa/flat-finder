name: Apply complete housing filters

on:
  push:
    branches: [ feat/flat-filters-complete ]
    paths:
      - scripts/patch-complete-filters.mjs
      - .github/workflows/apply-complete-filters.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flat-filters-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-complete-filters.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/server.js backend/src/normalize.js
          git diff --cached --quiet && exit 0
          git commit -m "Add complete housing filters"
          git push origin HEAD:feat/flat-filters-complete
