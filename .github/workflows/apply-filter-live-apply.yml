name: Apply filter live-apply patch

on:
  push:
    branches:
      - fix/flutter-filter-live-apply

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-filter-live-apply
      - name: Apply focused FilterSheet patch
        run: python .github/scripts/apply-filter-live-apply.py
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/widgets/filter_sheet.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix(app): make filter live apply explicit'
          git push
