name: Apply map amenity sort patch

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/map-amenity-filters-sorting' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/map-amenity-filters-sorting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply patch
        run: python3 .github/patches/apply-map-amenity-sort.py
      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Commit generated changes
        run: |
          rm .github/patches/apply-map-amenity-sort.py
          rm .github/workflows/apply-map-amenity-sort.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: validate map pins and add amenity sorting filters"
          git push origin HEAD:feat/map-amenity-filters-sorting
