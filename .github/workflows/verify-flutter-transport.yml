name: Verify Flutter transport fields

on:
  push:
    branches:
      - feat/transport-fields-ui

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transport-fields-ui
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Flutter
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/verify-flutter-transport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(flutter): verify transport fields'
          git push origin HEAD:feat/transport-fields-ui
