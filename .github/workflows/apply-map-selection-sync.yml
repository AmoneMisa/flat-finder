name: Apply map selection sync

on:
  push:
    branches:
      - feature/map-selection-presets-loader-20260830

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[map-sync-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/map-selection-presets-loader-20260830
          fetch-depth: 0

      - name: Apply interaction and home UX changes
        run: |
          python .github/apply_map_patch.py
          sed -i 's/if (!mounted || _zones\.all\.isEmpty) return false;/if (!mounted) return false;/' app/lib/widgets/map_view.dart

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and analyze
        working-directory: app
        run: |
          flutter pub get
          dart format lib/screens/home_screen.dart lib/widgets/map_view.dart lib/widgets/quick_presets_bar.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit generated changes
        run: |
          rm .github/apply_map_patch.py .github/workflows/apply-map-selection-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(app): sync map selections and presets [map-sync-applied]"
          git push origin HEAD:feature/map-selection-presets-loader-20260830
