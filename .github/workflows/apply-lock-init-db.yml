name: Apply serialized PostgreSQL schema init

on:
  push:
    branches: [ perf/postgres-search-no-redis ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch initDb
        run: python .github/patches/lock-init-db.py
      - name: Commit schema init lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/db.js
          git commit -m 'fix: serialize Postgres schema initialization'
          git push origin HEAD:perf/postgres-search-no-redis
