name: Verify flat-finder Flutter pull request

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'app/**'
      - '.github/workflows/verify-flutter-pr.yml'

permissions:
  contents: read

concurrency:
  group: verify-flutter-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Verify Flutter app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
