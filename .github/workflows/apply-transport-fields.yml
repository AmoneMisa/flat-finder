name: Apply transport fields

on:
  push:
    branches:
      - feat/transport-fields-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transport-fields-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply code patch
        run: python3 .github/scripts/apply_transport_fields.py
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Run backend tests
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Commit generated changes
        run: |
          rm .github/workflows/apply-transport-fields.yml
          rm .github/scripts/apply_transport_fields.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(transport): expose bus tram and trolleybus fields'
          git push origin HEAD:feat/transport-fields-ui
