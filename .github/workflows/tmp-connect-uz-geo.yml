name: Temporary Uzbekistan geo integration

on:
  push:
    branches:
      - feat/use-uzbekistan-geo-package

concurrency:
  group: temporary-uzbekistan-geo-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/use-uzbekistan-geo-package
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh dependency from parsing-lexicon master
        run: >-
          npm install --prefix backend
          '@whiteslove/parsing-lexicon@https://github.com/AmoneMisa/parsing-lexicon/archive/refs/heads/master.tar.gz'
          --save-exact --ignore-scripts --no-audit --no-fund
      - name: Verify Uzbekistan integration
        run: |
          node --check backend/src/reverse-geo.js
          node --check backend/src/uzbekistan-geo.js
          node --test \
            backend/test/uzbekistan-geo-package.test.js \
            backend/test/geocode-priority.test.js \
            backend/test/city-normalization.test.js
      - name: Commit refreshed lock and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/tmp-connect-uz-geo.yml
          git add backend/package.json backend/package-lock.json
          git commit -m "chore: refresh parsing lexicon master lock"
          git push origin HEAD:feat/use-uzbekistan-geo-package
