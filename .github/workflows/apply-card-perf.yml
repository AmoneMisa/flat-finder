name: Apply card perf patch

on:
  push:
    branches:
      - perf/flutter-card-rendering-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: perf/flutter-card-rendering-v2
      - name: Apply focused ListingCard patch
        run: python .github/scripts/apply-card-perf.py
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/widgets/listing_card.dart
          git diff --cached --quiet && exit 0
          git commit -m 'perf(app): narrow listing card rebuilds and image decode'
          git push
