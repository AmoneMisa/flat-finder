name: Verify complete housing filters

on:
  push:
    branches: [ feat/flat-filters-complete ]
    paths:
      - .github/workflows/verify-complete-filters.yml

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flat-filters-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Test and record result
        shell: bash
        run: |
          set +e
          cd backend && npm test > /tmp/filter-test.log 2>&1
          status=$?
          cd ..
          { echo "status=$status"; tail -n 80 /tmp/filter-test.log; } > .filter-test-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .filter-test-result.txt
          git commit -m "Record housing filter test result"
          git push origin HEAD:feat/flat-filters-complete
          exit $status
