name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy.sh'
      - 'docker-compose*.yml'
      - 'sample.env'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - refactor/architecture-cleanup
    paths:
      - 'backend/**'
      - 'deploy.sh'
      - 'docker-compose*.yml'
      - 'sample.env'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check backend JavaScript syntax
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check deployment script syntax
        run: bash -n deploy.sh
      - name: Run architecture regression tests
        run: |
          node --test \
            backend/test/app-composition.test.js \
            backend/test/internal-auth.test.js \
            backend/test/migrations.test.js \
            backend/test/mock-production.test.js \
            backend/test/system-routes.test.js \
            backend/test/listing-routes.test.js \
            backend/test/queue-crawl-stability.test.js
      - name: Report full backend suite
        continue-on-error: true
        run: npm test --prefix backend
