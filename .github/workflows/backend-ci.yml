name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy.sh'
      - 'docker-compose*.yml'
      - 'sample.env'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - master
      - refactor/architecture-cleanup
    paths:
      - 'backend/**'
      - 'deploy.sh'
      - 'docker-compose*.yml'
      - 'sample.env'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder
          POSTGRES_DB: flatfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://flatfinder:flatfinder@127.0.0.1:5432/flatfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Verify backend module graph
        run: node -e "import('./backend/src/tashkent-metro.js')"
      - name: Check backend JavaScript syntax
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check deployment script syntax
        run: bash -n deploy.sh
      - name: Run architecture regression tests
        run: |
          node --test \
            backend/test/app-composition.test.js \
            backend/test/cache.test.js \
            backend/test/config-cleanup.test.js \
            backend/test/custom-source-guards.test.js \
            backend/test/custom-source-security.test.js \
            backend/test/internal-auth.test.js \
            backend/test/legacy-boundaries.test.js \
            backend/test/migrations.test.js \
            backend/test/mock-production.test.js \
            backend/test/request-rate-limit.test.js \
            backend/test/system-routes.test.js \
            backend/test/listing-routes.test.js \
            backend/test/queue-crawl-stability.test.js \
            backend/test/tashkent-metro-contract.test.js
      - name: Run persisted dedupe regression
        run: node --test backend/test/persisted-dedupe-key.integration.test.js backend/test/telegram-room-dedupe.test.js
      - name: Run full backend suite
        run: npm test --prefix backend
