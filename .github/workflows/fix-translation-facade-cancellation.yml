name: Fix translation facade cancellation

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/fix-translation-facade-cancellation.py'
      - '.github/workflows/fix-translation-facade-cancellation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Apply facade cancellation fix
        run: python3 .github/scripts/fix-translation-facade-cancellation.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/services/api_service.dart app/test/translation_cancellation_test.dart
          git commit -m 'fix(app): preserve cancellation through translation facade'
          git push origin HEAD:develop
