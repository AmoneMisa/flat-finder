name: Apply Flutter runtime asset optimization

on:
  push:
    branches:
      - perf/flutter-runtime-assets

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/flutter-runtime-assets
      - name: Generate runtime icon and narrow bundle assets
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('app/assets/icon/icon.png')
          target = Path('app/assets/icon/runtime.png')
          with Image.open(source) as image:
              image = image.convert('RGB')
              image.thumbnail((192, 192), Image.Resampling.LANCZOS)
              image.save(target, format='PNG', optimize=True)

          pubspec = Path('app/pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          old = '''  assets:\n    - assets/icon/icon.png\n    - assets/logo.png\n'''
          new = '''  assets:\n    - assets/icon/runtime.png\n'''
          if old not in text:
              raise SystemExit('pubspec asset block not found')
          pubspec.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('app/lib/screens/home_screen.dart')
          text = home.read_text(encoding='utf-8')
          old = "'assets/icon/icon.png'"
          if old not in text:
              raise SystemExit('header icon reference not found')
          home.write_text(text.replace(old, "'assets/icon/runtime.png'", 1), encoding='utf-8')
          PY
          echo 'Generated runtime asset:'
          du -h app/assets/icon/runtime.png
          file app/assets/icon/runtime.png
          rm .github/workflows/apply-runtime-assets.yml
      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/icon/runtime.png app/pubspec.yaml app/lib/screens/home_screen.dart .github/workflows/apply-runtime-assets.yml
          git commit -m 'perf(app): shrink bundled runtime artwork'
          git push
