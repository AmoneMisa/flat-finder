name: Apply targeted Flutter audit fixes

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-flutter-audit-targeted.py'
      - '.github/workflows/apply-flutter-audit-targeted.yml'

permissions:
  contents: write

concurrency:
  group: apply-flutter-audit-targeted
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply asserted replacements
        run: python .github/scripts/apply-flutter-audit-targeted.py

      - name: Commit patched Flutter files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/screens/home_screen.dart app/lib/widgets/map_view.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(app): share transport and guard map zone races'
          git push origin HEAD:develop
