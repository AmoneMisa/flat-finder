name: Fix home timer import

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/fix-home-timer-import.py'
      - '.github/workflows/fix-home-timer-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - run: python .github/scripts/fix-home-timer-import.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/screens/home_screen.dart
          git commit -m 'fix(app): restore home filter debounce timer import'
          git push origin HEAD:develop
