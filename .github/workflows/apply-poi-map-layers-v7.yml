name: Apply canonical POI consumer patch v7

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare whitespace-tolerant patcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-poi-map-layers-v6.yml').read_text()
          marker = "cat > /tmp/apply_poi.py <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          helper_start = script.index('def replace(path, old, new, count=1):')
          helper_end = script.index('\n\nmodel =', helper_start)
          helper = '''def replace(path, old, new, count=1):
              import re
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == count:
                  p.write_text(text.replace(old, new, count))
                  return
              lines = old.splitlines()
              pattern = r"\\n".join(r"[ \\t]*" + re.escape(line.lstrip()) for line in lines)
              matches = list(re.finditer(pattern, text))
              if len(matches) != count:
                  raise SystemExit(f"{path}: exact={found}, tolerant={len(matches)}: {old[:120]!r}")
              p.write_text(re.sub(pattern, lambda _: new, text, count=count))'''
          script = script[:helper_start] + helper + script[helper_end:]
          compile(script, '/tmp/apply_poi.py', 'exec')
          Path('/tmp/apply_poi.py').write_text(script)
          PY
          python3 /tmp/apply_poi.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          node --check backend/src/district-zones.js
          node --check backend/src/catalog-routes.js
          node --test backend/test/map-zones-contract.test.js
          npm test --prefix backend
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Verify Flutter
        working-directory: app
        run: |
          dart format lib/models/district_zone.dart lib/widgets/map_view.dart lib/l10n/strings.dart lib/screens/home_screen.dart lib/screens/listing_detail.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit validated patch and clean staging workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-poi-map-layers*.yml
          git add backend/src/district-zones.js backend/src/catalog-routes.js backend/test/map-zones-contract.test.js app/lib/models/district_zone.dart app/lib/widgets/map_view.dart app/lib/l10n/strings.dart app/lib/screens/home_screen.dart app/lib/screens/listing_detail.dart app/pubspec.yaml
          git commit -m 'feat(app): add canonical POI map layers'
          git push origin HEAD:master
