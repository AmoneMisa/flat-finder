name: Apply map performance audit fixes

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-map-performance-audit.py'
      - '.github/workflows/apply-map-performance-audit.yml'

permissions:
  contents: write

concurrency:
  group: apply-map-performance-audit
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply asserted replacements
        run: python .github/scripts/apply-map-performance-audit.py

      - name: Commit patched map
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/widgets/map_view.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'perf(app): isolate map camera overlays'
          git push origin HEAD:develop
