name: Canonical city storage once
on:
  push:
    branches: [fix/canonical-city-statistics]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flatfinder
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: flatfinder
      POSTGRES_USER: flatfinder
      POSTGRES_PASSWORD: flatfinder-test
      TEST_POSTGRES_URL: postgresql://flatfinder:flatfinder-test@127.0.0.1:5432/flatfinder
      TEST_POSTGRES_SEARCH: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/canonical-city-statistics}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: |
          npm ci --prefix backend
          npm run install:internal --prefix backend
      - name: Apply canonical storage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('backend/src/db.js'); s=p.read_text()
          s=s.replace("import {enrichListingDetails} from './listing-enrichment.js';", "import {enrichListingDetails} from './listing-enrichment.js';\nimport {canonicalCity} from '@whiteslove/parsing-lexicon/geography';")
          s=s.replace("    const listing = enrichListingDetails(inputListing);\n\n    return {", "    const listing = enrichListingDetails(inputListing);\n    const country = String(listing.country || '').toUpperCase();\n    const sourceCity = String(listing.city || '').trim();\n    const city = sourceCity ? (canonicalCity(sourceCity, country) || sourceCity) : null;\n    const data = city && sourceCity && city !== sourceCity\n        ? {...listing, city, sourceCity}\n        : {...listing, city};\n\n    return {")
          s=s.replace("        country:\n            String(\n                listing.country || '',\n            ).toUpperCase(),", "        country,")
          s=s.replace("        city:\n            listing.city ?? null,", "        city,")
          s=s.replace("        data: listing,", "        data,")
          p.write_text(s)

          p=Path('backend/src/listing-routes.js'); s=p.read_text()
          s=s.replace("import {COUNTRIES, COUNTRY_CODES} from './countries.js';", "import {COUNTRY_CODES} from './countries.js';\nimport {canonicalCity} from '@whiteslove/parsing-lexicon/geography';")
          start=s.index('function addCityAliases(')
          end=s.index('\n\nasync function tryPostgresSearch', start)
          s=s[:start]+"function canonicalizeCityFilter(filters, codes) {\n  if (!filters.city) return;\n  const country = codes.length === 1 ? codes[0] : undefined;\n  filters.city = canonicalCity(filters.city, country) || filters.city;\n}\n"+s[end:]
          s=s.replace('    addCityAliases(filters, codes);','    canonicalizeCityFilter(filters, codes);')
          p.write_text(s)

          p=Path('backend/src/postgres-search.js'); s=p.read_text()
          old="""  if (filters.city) {\n    const forms = [...new Set((filters.cityAliases?.length ? filters.cityAliases : [filters.city]).map((value) => String(value).toLowerCase()).filter(Boolean))];\n    where.push(`LOWER(l.city) = ANY(${add(forms)}::text[])`);\n  }"""
          new="""  if (filters.city) where.push(`l.city = ${add(String(filters.city))}`);"""
          if old not in s: raise SystemExit('city filter block not found')
          p.write_text(s.replace(old,new))

          t=Path('backend/test/postgres-search.integration.test.js'); s=t.read_text()
          s=s.replace("    cityAliases: ['Odesa'],\n", '')
          s=s.replace("    cityAliases: ['Tashkent'],\n", '')
          marker="  assert.equal(first.statistics.geographies.city[0]?.label, 'Odesa');\n"
          extra="""  assert.equal(first.statistics.geographies.city[0]?.label, 'Odesa');\n\n  await upsertListings([\n    listing('kyiv-ru', 600, 'USD', 'Киев', true, 6),\n    listing('kyiv-uk', 800, 'USD', 'Київ', true, 7),\n  ]);\n  const kyiv = await searchPostgresListings({\n    filters: {...filters, city: 'Kyiv', priceMax: null, limit: 20, includeStats: true},\n    countries: ['UA'],\n    rates: {USD: 1, UAH: 40},\n  });\n  assert.equal(kyiv.count, 3);\n  assert.equal(kyiv.statistics.geographies.city.length, 1);\n  assert.equal(kyiv.statistics.geographies.city[0]?.label, 'Kyiv');\n  assert.equal(kyiv.statistics.geographies.city[0]?.medianUsd, 600);\n  const storedKyiv = await pool.query(\"SELECT city, data->>'city' AS data_city, data->>'sourceCity' AS source_city FROM listings WHERE source='pg-search-test' AND source_id='kyiv-ru'\");\n  assert.deepEqual(storedKyiv.rows[0], {city: 'Kyiv', data_city: 'Kyiv', source_city: 'Киев'});\n"""
          if marker not in s: raise SystemExit('test marker not found')
          t.write_text(s.replace(marker,extra))
          PY

          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {CITIES} from './backend/node_modules/@whiteslove/parsing-lexicon/src/geography.js';
          const esc = (v) => String(v).replaceAll("'", "''");
          const rows=[];
          for (const city of CITIES) {
            const aliases=new Set([city.canonical]);
            for (const values of Object.values(city.aliases || {})) for (const v of Array.isArray(values)?values:[values]) if (v) aliases.add(String(v));
            for (const alias of aliases) rows.push(`('${esc(city.country)}','${esc(alias)}','${esc(city.canonical)}')`);
          }
          const sql=`-- Snapshot generated from parsing-lexicon CITIES for one-time canonical storage backfill.\nWITH city_alias(country, alias, canonical) AS (VALUES\n  ${rows.join(',\n  ')}\n), mapped AS (\n  SELECT l.id, a.canonical, l.city AS source_city\n  FROM listings l JOIN city_alias a ON a.country=l.country AND LOWER(BTRIM(a.alias))=LOWER(BTRIM(l.city))\n  WHERE l.city IS NOT NULL AND l.city IS DISTINCT FROM a.canonical\n)\nUPDATE listings l SET\n  city=m.canonical,\n  data=jsonb_set(\n    CASE WHEN COALESCE(l.data->>'sourceCity','')='' THEN jsonb_set(l.data,'{sourceCity}',to_jsonb(m.source_city),true) ELSE l.data END,\n    '{city}',to_jsonb(m.canonical),true\n  ),\n  updated_at=NOW()\nFROM mapped m WHERE l.id=m.id;\n\nCREATE INDEX IF NOT EXISTS listings_country_city_deal_idx ON listings(country, city, deal_type) WHERE active=TRUE;\n`;
          await writeFile('./backend/migrations/999_canonical_city_storage.sql', sql);
          NODE
      - run: npm run migrate --prefix backend
      - run: node --check backend/src/db.js && node --check backend/src/listing-routes.js && node --check backend/src/postgres-search.js
      - run: node --test backend/test/postgres-search.integration.test.js
      - run: npm test --prefix backend
      - name: Commit
        run: |
          rm -f .github/workflows/canonical-city-storage-once.yml .github/workflows/fix-canonical-city-stats-once.yml .github/workflows/fix-canonical-city-stats-retry.yml .github/workflows/fix-canonical-city-stats-retry2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: store canonical cities at ingestion"
          git push origin HEAD:fix/canonical-city-statistics