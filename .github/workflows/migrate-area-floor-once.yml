name: Migrate area and floor parsers once

on:
  push:
    branches:
      - refactor/shared-housing-area-floor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-housing-area-floor
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delegate area and floor parsers
        working-directory: backend
        run: |
          npm install @whiteslove/parsing-lexicon@0.2.4 --save-exact --ignore-scripts --no-audit --no-fund
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/textparse-legacy.js')
          s = p.read_text()
          start = s.index('export function parseAreaFromText')
          end = s.index('// Classify a listing\'s deal type')
          s = s[:start] + s[end:]
          start = s.index('export function parseFloor')
          end = s.index('// Construction year.')
          s = s[:start] + s[end:]
          p.write_text(s)

          p = Path('src/textparse.js')
          s = p.read_text()
          needle = "  parseHousingResidentialComplex as parseResidentialComplex,\n"
          insert = needle + "  parseHousingAreaFromText as parseAreaFromText,\n  parseHousingFloorFromText as parseFloor,\n"
          if needle not in s:
              raise SystemExit('housing text export anchor not found')
          p.write_text(s.replace(needle, insert, 1))
          PY
      - name: Validate consumer contracts
        working-directory: backend
        run: |
          node --check src/textparse-legacy.js
          node --check src/textparse.js
          node --test test/textparse.test.js test/uzbek-listing.test.js test/no-makler.test.js
          npm test
      - name: Commit migration
        run: |
          git rm .github/workflows/migrate-area-floor-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json backend/src/textparse-legacy.js backend/src/textparse.js
          git commit -m 'Delegate area and floor parsers to parsing package'
          git push origin HEAD:refactor/shared-housing-area-floor
