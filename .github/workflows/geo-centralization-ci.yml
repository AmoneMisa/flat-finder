name: Geo Centralization CI

on:
  push:
    branches:
      - fix/backend-ci-geo-centralization

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check backend JavaScript syntax
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full backend suite
        shell: bash
        run: |
          set +e
          npm test --prefix backend 2>&1 | tee backend/test-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-centralization-test-output
          path: backend/test-output.txt
          if-no-files-found: error
