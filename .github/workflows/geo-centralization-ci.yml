name: Geo Centralization CI

on:
  push:
    branches:
      - fix/backend-ci-geo-centralization

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-ci-geo-centralization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh backend lockfile
        run: npm install --package-lock-only --prefix backend
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check backend JavaScript syntax
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full backend suite
        run: npm test --prefix backend
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json
          git commit -m "chore(geo): refresh parsing lexicon lockfile"
          git push origin HEAD:fix/backend-ci-geo-centralization
