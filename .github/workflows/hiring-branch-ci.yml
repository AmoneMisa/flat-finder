name: Hiring storage branch CI

on:
  push:
    branches: [ hiring/candidate-storage ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check hiring storage syntax
        run: |
          node --check backend/src/hiring-db.js
          node --check backend/src/hiring-routes.js
          node --check backend/src/bootstrap.js
      - name: Run backend tests
        run: npm test --prefix backend
