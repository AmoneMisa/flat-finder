name: Apply strict pet friendly filter

on:
  push:
    branches: [ feat/geocoding-priority ]
    paths:
      - scripts/patch-pet-friendly.mjs
      - .github/workflows/apply-pet-filter-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/geocoding-priority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-pet-friendly.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/normalize.js
          git diff --cached --quiet && exit 0
          git commit -m "Require explicit pet friendly listings"
          git push origin HEAD:feat/geocoding-priority
