name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve changed services
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          current="${{ github.sha }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            app=true
            olx_availability=true
          else
            changed_files="$(git diff --name-only "$before" "$current" || true)"
            if grep -Eq '^(backend/|frontend/|docker-compose\.yml|deploy\.sh|scripts/|\.github/workflows/deploy\.yml)' <<<"$changed_files"; then
              app=true
            else
              app=false
            fi
            if grep -Eq '^(olx-availability/|docker-compose\.yml|deploy\.sh|scripts/|\.github/workflows/deploy\.yml)' <<<"$changed_files"; then
              olx_availability=true
            else
              olx_availability=false
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "olx_availability=$olx_availability" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Check backend and deployment syntax
        run: |
          find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n deploy.sh
          bash -n scripts/upgrade-postgres-18.sh
          bash -n scripts/fallback-deploy.sh
          bash -n scripts/install-fallback-timer.sh

      - name: Validate Compose and retired infrastructure
        run: |
          touch .env
          docker compose config >/dev/null
          grep -q 'image: postgres:18-alpine' docker-compose.yml

      - name: Log in to GHCR
        if: steps.changed.outputs.app == 'true' || steps.changed.outputs.olx_availability == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changed.outputs.app == 'true' || steps.changed.outputs.olx_availability == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: steps.changed.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flat-finder-backend:latest

      - name: Build and push frontend
        if: steps.changed.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flat-finder-frontend:latest

      - name: Build and push OLX availability
        if: steps.changed.outputs.olx_availability == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./olx-availability
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flat-finder-olx-availability:latest

      - name: Deploy over SSH
        if: steps.changed.outputs.app == 'true' || steps.changed.outputs.olx_availability == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd "${{ secrets.SERVER_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            docker compose pull
            docker compose up -d --remove-orphans
