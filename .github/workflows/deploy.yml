name: Verify, build and deploy flat-finder

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flatfinder
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: flatfinder
      POSTGRES_USER: flatfinder
      POSTGRES_PASSWORD: flatfinder-test
      TEST_POSTGRES_URL: postgresql://flatfinder:flatfinder-test@127.0.0.1:5432/flatfinder
    outputs:
      elasticsearch_changed: ${{ steps.changes.outputs.elasticsearch }}
      app_changed: ${{ steps.changes.outputs.app }}
      olx_availability_changed: ${{ steps.changes.outputs.olx_availability }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed_files="__FULL_BUILD__"
          else
            changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
          fi
          printf 'Changed files:\n%s\n' "$changed_files"

          matches() {
            local pattern="$1"
            [[ "$changed_files" == "__FULL_BUILD__" ]] || grep -Eq "$pattern" <<<"$changed_files"
          }

          elasticsearch=false
          app=false
          olx_availability=false
          matches '^elasticsearch/' && elasticsearch=true
          matches '^app/' && app=true
          matches '^(olx-fetcher/|backend/src/availability(-routes|-sweep)?\.js|backend/src/listing-item-routes\.js|backend/test/availability|backend/test/listing-item-availability)' && olx_availability=true

          echo "elasticsearch=$elasticsearch" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "olx_availability=$olx_availability" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Check backend and deployment syntax
        run: |
          find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n deploy.sh
          bash -n scripts/upgrade-postgres-18.sh
          bash -n scripts/fallback-deploy.sh
          bash -n scripts/install-fallback-timer.sh

      - name: Validate Compose and retired infrastructure
        run: |
          touch .env
          docker compose config >/dev/null
          grep -q 'image: postgres:18-alpine' docker-compose.yml
          grep -q 'flat-finder-migrate:' docker-compose.yml
          grep -q 'command: \["node", "src/migrate.js"\]' docker-compose.yml
          grep -q 'flat-finder-worker:' docker-compose.yml
          ! grep -q 'flat-finder-rabbitmq' docker-compose.yml
          ! grep -q 'RABBITMQ_' docker-compose.yml
          ! grep -q 'flat-finder-redis' docker-compose.yml
          ! grep -q 'REDIS_URL=' docker-compose.yml
          ! grep -q 'flat-finder-queue-task-api:' docker-compose.yml
          ! grep -q 'QUEUE_TASK_API_URL' docker-compose.yml
          ! test -e queue-worker/worker.py
          ! test -e backend/src/queue-task-server.js

      - name: Apply database migrations
        run: npm run migrate --prefix backend

      - name: Run PostgreSQL integration regressions
        env:
          TEST_POSTGRES_SEARCH: '1'
        run: >-
          node --test
          backend/test/pg-queue.integration.test.js
          backend/test/postgres-search.integration.test.js
          backend/test/market-comparison.integration.test.js
          backend/test/filter-parity.integration.test.js
          backend/test/availability.integration.test.js
          backend/test/availability-force.integration.test.js
          backend/test/listing-item-availability.test.js
          backend/test/queue-crawl-stability.test.js
          backend/test/social-housing-lifecycle.test.js
          backend/test/social-fetch-contracts.test.js

      - name: Run full backend suite
        run: npm test --prefix backend

      - name: Set up Python
        if: steps.changes.outputs.olx_availability == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify OLX availability classifier
        if: steps.changes.outputs.olx_availability == 'true'
        run: |
          python -m pip install -r olx-fetcher/requirements.txt
          python -m py_compile olx-fetcher/app.py
          cd olx-fetcher
          python -m unittest -v test_app.py

      - name: Set up Flutter
        if: steps.changes.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Verify Flutter app
        if: steps.changes.outputs.app == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  build-images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amonemisa/flat-finder-backend:${{ github.sha }}
            ghcr.io/amonemisa/flat-finder-backend:latest
          cache-from: type=gha,scope=flat-finder-backend
          cache-to: type=gha,mode=max,scope=flat-finder-backend

      - name: Build and push OLX fetcher image
        uses: docker/build-push-action@v6
        with:
          context: ./olx-fetcher
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amonemisa/flat-finder-olx-fetcher:${{ github.sha }}
            ghcr.io/amonemisa/flat-finder-olx-fetcher:latest
          cache-from: type=gha,scope=flat-finder-olx-fetcher
          cache-to: type=gha,mode=max,scope=flat-finder-olx-fetcher

      - name: Build and push social fetcher image
        uses: docker/build-push-action@v6
        with:
          context: ./social-fetcher
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amonemisa/flat-finder-social-fetcher:${{ github.sha }}
            ghcr.io/amonemisa/flat-finder-social-fetcher:latest
          cache-from: type=gha,scope=flat-finder-social-fetcher
          cache-to: type=gha,mode=max,scope=flat-finder-social-fetcher

      - name: Build and push Elasticsearch image
        if: needs.verify.outputs.elasticsearch_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./elasticsearch
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amonemisa/flat-finder-elasticsearch:${{ github.sha }}
            ghcr.io/amonemisa/flat-finder-elasticsearch:latest
          cache-from: type=gha,scope=flat-finder-elasticsearch
          cache-to: type=gha,mode=max,scope=flat-finder-elasticsearch

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, build-images]
    environment: Production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/opt/flat-finder
            DEPLOY_SHA="${{ github.sha }}" \
            DEPLOY_SOURCE=github \
            UPDATE_ELASTICSEARCH="${{ needs.verify.outputs.elasticsearch_changed }}" \
              flock -w 1800 /tmp/flat-finder-deploy.lock bash -c '
                git restore --source=HEAD --staged --worktree -- \
                  docker-compose.yml deploy.sh olx-router/nginx.conf scripts/upgrade-postgres-18.sh || true
                git pull --ff-only
                bash ./scripts/upgrade-postgres-18.sh
                bash ./deploy.sh "$DEPLOY_SHA" "$UPDATE_ELASTICSEARCH"
              '
