name: Build and deploy flat-finder

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      rebuild_elasticsearch:
        description: Rebuild and restart the Elasticsearch image
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

# One deploy at a time. Two pushes in quick succession would otherwise SSH
# into the same server and reconcile the same compose project concurrently.
# Queue the runs rather than cancelling: killing a half-applied deploy is
# worse than waiting for one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      elasticsearch: ${{ steps.elasticsearch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: elasticsearch
        name: Detect Elasticsearch image changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.rebuild_elasticsearch }}" == "true" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- elasticsearch/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flat-finder-backend
            context: ./backend
          - image: flat-finder-queue-worker
            context: ./queue-worker
          - image: flat-finder-olx-fetcher
            context: ./olx-fetcher
          - image: flat-finder-social-fetcher
            context: ./social-fetcher

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amonemisa/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/amonemisa/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build-elasticsearch:
    needs: detect-changes
    if: needs.detect-changes.outputs.elasticsearch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push flat-finder-elasticsearch
        uses: docker/build-push-action@v6
        with:
          context: ./elasticsearch
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amonemisa/flat-finder-elasticsearch:${{ github.sha }}
            ghcr.io/amonemisa/flat-finder-elasticsearch:latest
          cache-from: type=gha,scope=flat-finder-elasticsearch
          cache-to: type=gha,mode=max,scope=flat-finder-elasticsearch

  deploy:
    environment: Production
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images, build-elasticsearch]
    # !cancelled() rather than always(): always() keeps this job running even
    # after the run is cancelled, so a deploy could not be aborted. The ref
    # check stops a workflow_dispatch from a feature branch shipping to prod.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.detect-changes.result == 'success' && needs.build-images.result == 'success' && (needs.build-elasticsearch.result == 'success' || needs.build-elasticsearch.result == 'skipped') }}

    steps:
      # The production compose file used to live only on the server. That meant
      # new images could deploy with stale service env/queue-shard wiring. Keep
      # runtime configuration versioned with the exact commit being deployed.
      - uses: actions/checkout@v4

      - name: Sync compose runtime config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,olx-router/nginx.conf,scripts/upgrade-postgres-18.sh"
          target: "~/opt/flat-finder"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            bash ~/opt/flat-finder/scripts/upgrade-postgres-18.sh
            bash ~/opt/flat-finder/deploy.sh "${{ github.sha }}" "${{ needs.detect-changes.outputs.elasticsearch }}"
