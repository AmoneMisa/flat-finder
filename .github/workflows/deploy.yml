name: Build and deploy flat-finder

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deploy at a time. Two pushes in quick succession would otherwise SSH
# into the same server and run `docker compose up` concurrently. Queue the
# runs rather than cancelling: killing a half-applied deploy is worse.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flat-finder-backend
            context: ./backend
          - image: flat-finder-queue-worker
            context: ./queue-worker
          - image: flat-finder-olx-fetcher
            context: ./olx-fetcher
          - image: flat-finder-elasticsearch
            context: ./elasticsearch

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amonemisa/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/amonemisa/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    environment: Production
    runs-on: ubuntu-latest
    needs: build-images
    # workflow_dispatch can be triggered from any branch; without this guard a
    # feature branch would ship straight to production.
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash ~/opt/flat-finder/deploy.sh ${{ github.sha }}
