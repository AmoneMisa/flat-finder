name: Refresh backend package lock

on:
  push:
    branches:
      - chore/use-published-shared-packages

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/use-published-shared-packages

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        working-directory: .
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: refresh backend npm package lock"
          git push
