name: Refresh shared parser lock once

on:
  push:
    branches: [refactor/shared-contact-currency-context]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-contact-currency-context
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refresh-shared-parser-lock-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json .github/workflows/refresh-shared-parser-lock-once.yml
          git commit -m "Refresh shared parser lockfile"
          git push origin HEAD:refactor/shared-contact-currency-context
