name: Apply home runtime events refactor

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-home-runtime-events-refactor.py'
      - '.github/workflows/apply-home-runtime-events-refactor.yml'

permissions:
  contents: write

concurrency:
  group: apply-home-runtime-events-refactor
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply asserted replacements
        run: python .github/scripts/apply-home-runtime-events-refactor.py

      - name: Commit refactor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib app/test
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(app): isolate home runtime events'
          git push origin HEAD:develop
