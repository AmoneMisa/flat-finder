name: Verify PostgreSQL crawler queue

on:
  push:
    branches: [ perf/postgres-search-no-redis, chore/postgres-18 ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flatfinder
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: flatfinder
      POSTGRES_USER: flatfinder
      POSTGRES_PASSWORD: flatfinder-test
      TEST_POSTGRES_SEARCH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Syntax checks
        run: |
          node --check backend/src/pgQueue.js
          node --check backend/src/queuePlan.js
          node --check backend/src/queueTasks.js
          node --check backend/src/queueTaskDedup.js
          node --check backend/src/availability-sweep.js
          node --check backend/src/worker.js
          node --check backend/src/scheduler.js
          bash -n scripts/upgrade-postgres-18.sh
          bash -n deploy.sh
      - name: Validate Compose
        run: |
          touch .env
          docker compose config >/dev/null
          grep -q 'image: postgres:18-alpine' docker-compose.yml
          grep -q 'flat-finder-postgres-data-v18:/var/lib/postgresql' docker-compose.yml
          grep -q 'flat-finder-worker:' docker-compose.yml
          ! grep -q 'flat-finder-queue-task-api:' docker-compose.yml
          ! grep -q 'flat-finder-queue-worker-' docker-compose.yml
          ! grep -q 'QUEUE_TASK_API_URL' docker-compose.yml
      - name: Build social fetcher and run contract tests
        run: docker build -t flat-finder-social-fetcher:test ./social-fetcher
      - name: Run queue and search regressions
        run: >-
          node --test
          backend/test/pg-queue.integration.test.js
          backend/test/postgres-search.integration.test.js
          backend/test/queue-crawl-stability.test.js
          backend/test/map-amenity-sort.test.js
          backend/test/ua-priority-coverage.test.js
      - name: Verify retired infrastructure is gone
        run: |
          ! grep -q 'flat-finder-rabbitmq' docker-compose.yml
          ! grep -q 'RABBITMQ_' docker-compose.yml
          ! grep -q 'flat-finder-redis' docker-compose.yml
          ! grep -q 'REDIS_URL=' docker-compose.yml
          ! test -e queue-worker/worker.py
          ! test -e backend/src/queue-task-server.js
