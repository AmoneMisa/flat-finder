name: Refactor country geo ownership safely
on:
  push:
    branches: [fix/country-geo-ownership-safe9]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/country-geo-ownership-safe9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix backend
      - run: npm run install:internal --prefix backend
      - run: node .github/scripts/refactor_country_geo_safe.mjs
      - name: Verify consumer contract only
        shell: bash
        run: |
          node --check backend/src/countries.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {COUNTRIES, canonicalCityName} from './backend/src/countries.js';
          assert.equal(COUNTRIES.UA.name, 'Ukraine');
          assert.equal(COUNTRIES.UA.currency, 'UAH');
          assert.equal(COUNTRIES.RO.currency, 'RON');
          assert.equal(COUNTRIES.KZ.currency, 'KZT');
          assert.equal(COUNTRIES.UZ.currency, 'UZS');
          assert.ok(COUNTRIES.UA.cities.includes('Kyiv'));
          assert.ok(COUNTRIES.UA.cities.includes('Donetsk'));
          assert.equal(canonicalCityName('UA', 'Киев'), 'Kyiv');
          assert.equal(canonicalCityName('UA', 'Київ'), 'Kyiv');
          assert.equal(canonicalCityName('RO', 'București'), 'Bucharest');
          assert.equal(canonicalCityName('XX', 'Unknownville'), 'Unknownville');
          NODE
      - name: Commit source-only change
        run: |
          rm -f .github/scripts/refactor_country_geo_safe.mjs
          rm -f .github/workflows/refactor-country-geo-safe-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/countries.js .github/scripts/refactor_country_geo_safe.mjs .github/workflows/refactor-country-geo-safe-once.yml
          git commit -m "Refactor country geography ownership"
          git push origin HEAD:fix/country-geo-ownership-safe9
