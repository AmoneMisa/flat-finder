name: Apply map filter sync fix

on:
  push:
    branches: [fix/map-filter-sync-query-clear-20260830]
    paths: [.github/workflows/apply-map-filter-sync.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-filter-sync-query-clear-20260830
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - name: Prevent stale text search after map selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/lib/screens/home_screen.dart')
          text = path.read_text()
          old = """  void didUpdateWidget(covariant _MobilePrimaryFilters oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    _sync(_query, widget.filters.query);\n    _sync(_priceMin, _numberText(widget.filters.priceMin));\n    _sync(_priceMax, _numberText(widget.filters.priceMax));\n  }\n"""
          new = """  void didUpdateWidget(covariant _MobilePrimaryFilters oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    // A map selection replaces the Filters object and may intentionally clear\n    // query while a 300 ms text-search debounce is still pending. Cancel only\n    // for an external filter replacement that disagrees with the local input;\n    // unrelated AppState notifications keep the same Filters instance, while a\n    // normal debounced search already has matching controller text.\n    if (!identical(oldWidget.filters, widget.filters) &&\n        _query.text != widget.filters.query) {\n      _debounce?.cancel();\n    }\n    _sync(_query, widget.filters.query);\n    _sync(_priceMin, _numberText(widget.filters.priceMin));\n    _sync(_priceMax, _numberText(widget.filters.priceMax));\n  }\n"""
          if old not in text:
              raise SystemExit('mobile primary didUpdateWidget anchor not found')
          path.write_text(text.replace(old, new, 1))

          map_text = Path('app/lib/widgets/map_view.dart').read_text()
          if "final scoped = current.copyWith(query: '');" not in map_text:
              raise SystemExit('map selection no longer clears Filters.query')
          for branch in ['district', 'microdistrict', 'mahalla', 'local_area', 'development_area', 'metro']:
              if f"'{branch}' => scoped.copyWith" not in map_text:
                  raise SystemExit(f'{branch} map scope is not synchronized')
          patched = path.read_text()
          if "!identical(oldWidget.filters, widget.filters)" not in patched:
              raise SystemExit('stale debounce cancellation guard missing')
          PY
      - name: Validate Flutter
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/lib/screens/home_screen.dart
          git commit -m "fix(app): cancel stale search after map filter change"
          git push origin HEAD:fix/map-filter-sync-query-clear-20260830
