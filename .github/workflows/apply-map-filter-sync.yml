name: Apply map filter sync fix

on:
  push:
    branches: [fix/map-filter-sync-query-clear-20260830]
    paths: [.github/workflows/apply-map-filter-sync.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-filter-sync-query-clear-20260830
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - name: Apply map selection filter sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/lib/widgets/map_view.dart')
          text = path.read_text()
          old = """    final current = state.filters;\n    final district = _ancestorOfType(zone, 'district');\n"""
          new = """    final current = state.filters;\n    // A map geography pick becomes the new search scope. Text search is a\n    // competing free-form scope, so clear it before applying the canonical\n    // geographic filter. AppState notifies the compact filters immediately,\n    // and their controller sync clears the visible search input as well.\n    final scoped = current.copyWith(query: '');\n    final district = _ancestorOfType(zone, 'district');\n"""
          if old not in text:
              raise SystemExit('map scope anchor not found')
          text = text.replace(old, new, 1)
          replacements = {
              "'district' => current.copyWith(": "'district' => scoped.copyWith(",
              "'microdistrict' => current.copyWith(": "'microdistrict' => scoped.copyWith(",
              "'mahalla' => current.copyWith(": "'mahalla' => scoped.copyWith(",
              "'local_area' => current.copyWith(": "'local_area' => scoped.copyWith(",
              "'development_area' => current.copyWith(": "'development_area' => scoped.copyWith(",
              "'metro' => current.copyWith(metro: zone.name)": "'metro' => scoped.copyWith(metro: zone.name)",
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'map scope branch not found: {before}')
              text = text.replace(before, after, 1)
          path.write_text(text)

          home = Path('app/lib/screens/home_screen.dart').read_text()
          if "_sync(_query, widget.filters.query);" not in home:
              raise SystemExit('compact search input is no longer synced from Filters.query')
          patched = path.read_text()
          if "final scoped = current.copyWith(query: '');" not in patched:
              raise SystemExit('map query reset missing')
          for branch in ['district', 'microdistrict', 'mahalla', 'local_area', 'development_area', 'metro']:
              if f"'{branch}' => scoped.copyWith" not in patched:
                  raise SystemExit(f'{branch} does not use query-cleared scope')
          PY
      - name: Validate Flutter
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/lib/widgets/map_view.dart
          git commit -m "fix(app): sync map geography with search filters"
          git push origin HEAD:fix/map-filter-sync-query-clear-20260830
