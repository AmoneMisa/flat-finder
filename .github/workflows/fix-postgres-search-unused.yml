name: Fix backend unused search helpers

on:
  push:
    branches: [ master ]
    paths:
      - '.github/scripts/fix-postgres-search-unused.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply backend cleanup
        run: python .github/scripts/fix-postgres-search-unused.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm test

      - name: Remove temporary patch files
        run: |
          rm .github/scripts/fix-postgres-search-unused.py
          rm .github/workflows/fix-postgres-search-unused.yml

      - name: Commit backend fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- backend/src/postgres-search-core.js .github/scripts/fix-postgres-search-unused.py .github/workflows/fix-postgres-search-unused.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(backend): remove obsolete search helpers'
          git push origin HEAD:master
