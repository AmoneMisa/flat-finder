name: Fix compact map race fixture

on:
  push:
    branches:
      - perf/flutter-map-point-model

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/flutter-map-point-model
      - name: Use an explicit located map point fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/test/state_correctness_test.dart')
          text = path.read_text(encoding='utf-8')
          old = 'api.mapCompleter!.complete([MapListingPoint.fromListing(old)]);'
          new = '''api.mapCompleter!.complete([\n        MapListingPoint(\n          id: old.id,\n          source: old.source,\n          country: old.country,\n          lat: 41.31,\n          lng: 69.28,\n          title: old.title,\n          currency: old.currency,\n          city: old.city,\n          propertyType: old.propertyType,\n        ),\n      ]);'''
          if old not in text:
              raise SystemExit('race fixture marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-map-race-fixture.yml
      - name: Commit fixture fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/test/state_correctness_test.dart .github/workflows/fix-map-race-fixture.yml
          git commit -m 'test(app): use located compact map race fixture'
          git push
