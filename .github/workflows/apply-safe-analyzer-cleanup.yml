name: Apply safe analyzer cleanup

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-safe-analyzer-cleanup.py'
      - '.github/workflows/apply-safe-analyzer-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Apply safe analyzer cleanup
        run: python3 .github/scripts/apply-safe-analyzer-cleanup.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/models/filters.dart app/lib/screens/listing_detail.dart app/lib/screens/swipe_review_screen.dart app/lib/utils/format.dart app/lib/utils/price_tone.dart app/lib/services/api_service_base.dart app/lib/services/api_service.dart app/test/country_locale_retry_test.dart app/test/sort_options_test.dart app/test/sorted_collection_test.dart app/test/statistics_snapshot_cache_test.dart app/test/metro_proximity_integration_test.dart
          git commit -m 'refactor(app): clear safe analyzer debt'
          git push origin HEAD:develop
