name: Apply shared API client fixes

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-shared-api-client.py'
      - '.github/workflows/apply-shared-api-client.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Apply shared client patch
        run: python3 .github/scripts/apply-shared-api-client.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/services/api_service_base.dart app/lib/services/api_service.dart app/lib/main.dart app/test/api_service_client_test.dart
          git commit -m 'refactor(app): reuse API transport client'
          git push origin HEAD:develop
