name: Apply mobile follow-up fixes

on:
  push:
    branches: [fix/mobile-ui-followup-20260830]
    paths: [.github/workflows/apply-mobile-followup.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flatfinder
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: flatfinder
      POSTGRES_USER: flatfinder
      POSTGRES_PASSWORD: flatfinder-test
      TEST_POSTGRES_URL: postgresql://flatfinder:flatfinder-test@127.0.0.1:5432/flatfinder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-ui-followup-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Backend: long-term whole-home rent must not include room-only listings.
          replace_once(
              'backend/src/postgres-search.js',
              """  if (filters.dealType && filters.dealType !== 'any') where.push(`l.deal_type = ${add(filters.dealType)}`);\n""",
              """  if (filters.dealType && filters.dealType !== 'any') {\n    where.push(`l.deal_type = ${add(filters.dealType)}`);\n    // Room shares are stored as longRent + roomOnly. A normal long-term rent\n    // query means the whole property; room-only is an explicit separate mode.\n    if (filters.dealType === 'longRent' && filters.roomOnly !== true) {\n      where.push(`NOT (l.data @> '{\"roomOnly\":true}'::jsonb)`);\n    }\n  }\n""",
          )

          # Normalize structured/stringified geo values before PostgreSQL ever sees them.
          replace_once(
              'backend/src/listing-enrichment.js',
              """function boundedCount(value, max = 20) {\n""",
              """function locationName(value) {\n  if (value == null) return null;\n  if (Array.isArray(value)) {\n    for (const item of value) {\n      const name = locationName(item);\n      if (name) return name;\n    }\n    return null;\n  }\n  if (typeof value === 'object') {\n    for (const key of ['name', 'canonicalName', 'label', 'station', 'value']) {\n      const name = locationName(value[key]);\n      if (name) return name;\n    }\n    return null;\n  }\n  const text = String(value).trim();\n  if (!text) return null;\n  if (text.startsWith('{') || text.startsWith('[')) {\n    try {\n      const decoded = JSON.parse(text);\n      const name = locationName(decoded);\n      if (name) return name;\n    } catch (_) {}\n  }\n  return text;\n}\n\nfunction boundedCount(value, max = 20) {\n""",
          )
          replace_once(
              'backend/src/listing-enrichment.js',
              """    nearby,\n  };\n""",
              """    nearby,\n    district: locationName(source.district) ?? enrichment.district ?? null,\n    metro: locationName(source.metro) ?? enrichment.metro ?? null,\n  };\n""",
          )

          # Compatibility display for numbered canonical microdistricts while 0.5.1 propagates.
          replace_once(
              'backend/src/catalog-routes.js',
              """function lexiconLocationLabel(name, locale, kind, countryCode, cityName) {\n""",
              """function numberedMicrodistrictLabel(name, locale) {\n  const raw = String(name || '').trim();\n  const match = raw.match(/^(.+?)[\\s-]+(\\d{1,2}[A-Za-zА-Яа-я]?)$/u);\n  if (!match) return null;\n  const base = geographyDisplayName(match[1], locale, 'district');\n  return base && base !== match[1] ? `${base}-${match[2]}` : null;\n}\n\nfunction lexiconLocationLabel(name, locale, kind, countryCode, cityName) {\n""",
          )
          replace_once(
              'backend/src/catalog-routes.js',
              """    if (direct && direct !== raw) return direct;\n  }\n\n  const dictionary = dictionaryFor(countryCode, cityName);\n""",
              """    if (direct && direct !== raw) return direct;\n    if (kind === 'microdistrict') {\n      const numbered = numberedMicrodistrictLabel(raw, locale);\n      if (numbered) return numbered;\n    }\n  }\n\n  const dictionary = dictionaryFor(countryCode, cityName);\n""",
          )

          # Integration regression: whole-home longRent excludes room share; explicit roomOnly finds it.
          replace_once(
              'backend/test/postgres-search.integration.test.js',
              """    listing('no-ac', 200, 'USD', 'Odesa', false, 5),\n  ]);\n""",
              """    listing('no-ac', 200, 'USD', 'Odesa', false, 5),\n    {...listing('room-share', 210, 'USD', 'Odesa', true, 6), roomOnly: true},\n  ]);\n""",
          )
          replace_once(
              'backend/test/postgres-search.integration.test.js',
              """  assert.equal(first.statistics.geographies.city[0]?.label, 'Odesa');\n\n  await upsertListings([\n""",
              """  assert.equal(first.statistics.geographies.city[0]?.label, 'Odesa');\n  assert.ok(!first.listings.some((item) => item.id === 'room-share'));\n\n  const roomOnly = await searchPostgresListings({\n    filters: {...filters, roomOnly: true, priceMax: null, limit: 20, cursor: '', offset: 0},\n    countries: ['UA'],\n    rates: {USD: 1, UAH: 40},\n  });\n  assert.equal(roomOnly.count, 1);\n  assert.equal(roomOnly.listings[0]?.id, 'room-share');\n\n  await upsertListings([\n""",
          )

          # AppState: do not permanently mark a locale loaded before the request succeeds.
          replace_once(
              'app/lib/state/app_state.dart',
              """  String _countriesLocale = '';\n\n  Future<void> init() async {\n""",
              """  String _countriesLocale = '';\n  String? _countriesLocaleLoading;\n\n  Future<void> init() async {\n""",
          )
          old_locale = """  Future<void> ensureCountriesLocale(String locale) async {\n    if (locale == _countriesLocale || countries.isEmpty) return;\n    _countriesLocale = locale;\n    try {\n      final localized = await _api.fetchCountries(locale: locale);\n      if (locale != _countriesLocale) return; // superseded by a newer call\n      countries = localized;\n      notifyListeners();\n    } catch (_) {\n      // Keep the unlocalized list rather than surfacing an error for what's\n      // a display-only enhancement.\n    }\n  }\n"""
          new_locale = """  Future<void> ensureCountriesLocale(String locale) async {\n    if (locale == _countriesLocale ||\n        locale == _countriesLocaleLoading ||\n        countries.isEmpty) {\n      return;\n    }\n    _countriesLocaleLoading = locale;\n    try {\n      final localized = await _api.fetchCountries(locale: locale);\n      if (locale != _countriesLocaleLoading) return; // superseded\n      countries = localized;\n      _countriesLocale = locale;\n      notifyListeners();\n    } catch (_) {\n      // Do not mark the locale as loaded after a transient failure. The next\n      // build can retry instead of leaving raw canonical names forever.\n    } finally {\n      if (_countriesLocaleLoading == locale) _countriesLocaleLoading = null;\n    }\n  }\n"""
          replace_once('app/lib/state/app_state.dart', old_locale, new_locale)

          # Listing parser: unwrap legacy/new structured metro and location values instead of printing JSON.
          p = Path('app/lib/models/listing.dart')
          text = p.read_text()
          if not text.startswith('/// Market-price'):
              raise SystemExit('unexpected listing.dart header')
          text = "import 'dart:convert';\n\n" + text
          anchor = """String _capitalizeFirstLetter(String value) {\n"""
          helper = """String? _locationName(dynamic value) {\n  if (value == null) return null;\n  if (value is Map) {\n    for (final key in ['name', 'canonicalName', 'label', 'station', 'value']) {\n      final name = _locationName(value[key]);\n      if (name != null && name.isNotEmpty) return name;\n    }\n    return null;\n  }\n  if (value is Iterable && value is! String) {\n    for (final item in value) {\n      final name = _locationName(item);\n      if (name != null && name.isNotEmpty) return name;\n    }\n    return null;\n  }\n  final text = value.toString().trim();\n  if (text.isEmpty) return null;\n  if (text.startsWith('{') || text.startsWith('[')) {\n    try {\n      final decoded = jsonDecode(text);\n      final name = _locationName(decoded);\n      if (name != null && name.isNotEmpty) return name;\n    } catch (_) {}\n  }\n  return text;\n}\n\nString _capitalizeFirstLetter(String value) {\n"""
          if anchor not in text:
              raise SystemExit('listing helper anchor not found')
          text = text.replace(anchor, helper, 1)
          text = text.replace("district: j['district'] as String?,", "district: _locationName(j['district']),", 1)
          text = text.replace("metro: j['metro'] as String?,", "metro: _locationName(j['metro']),", 1)
          text = text.replace("kvartal: (j['kvartal'] ?? j['area']) as String?,", "kvartal: _locationName(j['kvartal'] ?? j['area']),", 1)
          text = text.replace("city: j['city'] ?? '',", "city: _locationName(j['city']) ?? '',", 1)
          p.write_text(text)

          # Home: remove redundant Fresh/24h view, show a real branded header, visible hide/show control.
          replace_once('app/lib/screens/home_screen.dart', 'enum _ViewTab { all, fresh, hidden }', 'enum _ViewTab { all, hidden }')
          replace_once(
              'app/lib/screens/home_screen.dart',
              """        title: Image.asset(\n          'assets/logo.png',\n          height: 36,\n          fit: BoxFit.contain,\n          semanticLabel: settings.t('appTitle'),\n        ),\n""",
              """        title: Row(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            Image.asset(\n              'assets/icon/icon.png',\n              width: 30,\n              height: 30,\n              fit: BoxFit.contain,\n              errorBuilder: (_, __, ___) => Icon(\n                Icons.home_work_outlined,\n                size: 28,\n                color: Theme.of(context).colorScheme.primary,\n              ),\n            ),\n            const SizedBox(width: 7),\n            Flexible(\n              child: Text(\n                settings.t('appTitle'),\n                maxLines: 1,\n                overflow: TextOverflow.fade,\n                softWrap: false,\n                style: const TextStyle(fontWeight: FontWeight.w800),\n              ),\n            ),\n          ],\n        ),\n""",
          )
          replace_once(
              'app/lib/screens/home_screen.dart',
              """                case 'view_fresh':\n                  setState(() => _tab = _ViewTab.fresh);\n""",
              '',
          )
          replace_once(
              'app/lib/screens/home_screen.dart',
              """                (_ViewTab.fresh, 'view_fresh', 'tabFresh', Icons.bolt),\n""",
              '',
          )
          old_apply = """    switch (_tab) {\n      case _ViewTab.all:\n        return active.toList();\n      case _ViewTab.fresh:\n        final cutoff = DateTime.now().toUtc().subtract(\n              const Duration(hours: 24),\n            );\n        return active\n            .where(\n              (l) =>\n                  l.createdAt != null && l.createdAt!.toUtc().isAfter(cutoff),\n            )\n            .toList();\n      case _ViewTab.hidden:\n        return const []; // unreachable, handled above\n    }\n  }\n\n  String _emptyLabel(SettingsState settings) => switch (_tab) {\n        _ViewTab.fresh => settings.t('noFreshHere'),\n        _ViewTab.hidden => settings.t('noHiddenHere'),\n        _ViewTab.all => settings.t('noListings'),\n      };\n"""
          new_apply = """    switch (_tab) {\n      case _ViewTab.all:\n        return active.toList();\n      case _ViewTab.hidden:\n        return const []; // unreachable, handled above\n    }\n  }\n\n  String _emptyLabel(SettingsState settings) => switch (_tab) {\n        _ViewTab.hidden => settings.t('noHiddenHere'),\n        _ViewTab.all => settings.t('noListings'),\n      };\n"""
          replace_once('app/lib/screens/home_screen.dart', old_apply, new_apply)
          old_collapse = """              SizedBox(\n                height: 24,\n                child: IconButton(\n                  tooltip:\n                      s.t(_collapsed ? 'expandFilters' : 'collapseFilters'),\n                  padding: EdgeInsets.zero,\n                  constraints:\n                      const BoxConstraints.tightFor(width: 44, height: 24),\n                  visualDensity: VisualDensity.compact,\n                  onPressed: () => setState(() => _collapsed = !_collapsed),\n                  icon: Icon(\n                    _collapsed\n                        ? Icons.keyboard_arrow_down\n                        : Icons.keyboard_arrow_up,\n                    size: 22,\n                  ),\n                ),\n              ),\n"""
          new_collapse = """              Center(\n                child: TextButton.icon(\n                  onPressed: () => setState(() => _collapsed = !_collapsed),\n                  style: TextButton.styleFrom(\n                    minimumSize: const Size(0, 30),\n                    padding: const EdgeInsets.symmetric(horizontal: 10),\n                    visualDensity: VisualDensity.compact,\n                  ),\n                  icon: Icon(\n                    _collapsed\n                        ? Icons.keyboard_arrow_down\n                        : Icons.keyboard_arrow_up,\n                    size: 20,\n                  ),\n                  label: Text(s.t(_collapsed ? 'showFilters' : 'hideFilters')),\n                ),\n              ),\n"""
          replace_once('app/lib/screens/home_screen.dart', old_collapse, new_collapse)

          # Detail: remove the Nearby pills block and the duplicate generic Nearby spec row.
          p = Path('app/lib/screens/listing_detail.dart')
          text = p.read_text()
          text, n = re.subn(
              r"\n\s*if \(listing\.nearby\.isNotEmpty\) \.\.\.\[\n\s*const SizedBox\(height: 16\),\n\s*Text\(s\.t\('nearby'\), style: theme\.textTheme\.titleSmall\),\n\s*const SizedBox\(height: 8\),\n\s*Wrap\(\n\s*spacing: 6,\n\s*runSpacing: 6,\n\s*children: listing\.nearby\n\s*\.map\(\n\s*\(n\) => Chip\(\n\s*avatar: const Icon\(Icons\.place_outlined, size: 18\),\n\s*label: Text\(s\.nearbyLabel\(n\)\),\n\s*visualDensity: VisualDensity\.compact,\n\s*backgroundColor:\n\s*theme\.colorScheme\.secondaryContainer,\n\s*\),\n\s*\)\n\s*\.toList\(\),\n\s*\),\n\s*\],",
              '',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'nearby chip block removed {n} times')
          text = text.replace(
              """      (\n        Icons.place_outlined,\n        'nearby',\n        l.nearby.isNotEmpty ? l.nearby.join(', ') : null,\n      ),\n""",
              '',
              1,
          )
          p.write_text(text)

          # Preset save is local-first; network synchronization must not hold the push prompt hostage.
          replace_once(
              'app/lib/state/presets.dart',
              """    await _persist();\n    await syncPushSubscriptions();\n    return preset;\n""",
              """    await _persist();\n    unawaited(syncPushSubscriptions());\n    return preset;\n""",
          )
          replace_once(
              'app/lib/widgets/filter_sheet.dart',
              """      final preset = await presets.save(name, _currentFilters());\n      if (preset == null || !mounted) return;\n      final enablePush = await showDialog<bool>(\n        context: context,\n""",
              """      final preset = await presets.save(name, _currentFilters());\n      if (preset == null || !mounted) return;\n      // Let the naming dialog finish its route transition before opening the\n      // follow-up. The save itself is local and must never wait for backend sync.\n      await Future<void>.delayed(const Duration(milliseconds: 120));\n      if (!mounted) return;\n      final enablePush = await showDialog<bool>(\n        context: context,\n        barrierDismissible: false,\n""",
          )

          # History clear confirmation.
          replace_once(
              'app/lib/screens/history_screen.dart',
              """  void _open(BuildContext context, Listing l) {\n    Navigator.of(\n      context,\n    ).push(MaterialPageRoute(builder: (_) => ListingDetailScreen(listing: l)));\n  }\n\n""",
              """  void _open(BuildContext context, Listing l) {\n    Navigator.of(\n      context,\n    ).push(MaterialPageRoute(builder: (_) => ListingDetailScreen(listing: l)));\n  }\n\n  Future<void> _confirmClear(\n    BuildContext context,\n    SettingsState settings,\n    HistoryState history,\n  ) async {\n    final confirmed = await showDialog<bool>(\n      context: context,\n      builder: (dialogContext) => AlertDialog(\n        title: Text(settings.t('clearHistory')),\n        content: Text(settings.t('clearHistoryConfirm')),\n        actions: [\n          TextButton(\n            onPressed: () => Navigator.pop(dialogContext, false),\n            child: Text(settings.t('cancel')),\n          ),\n          FilledButton(\n            onPressed: () => Navigator.pop(dialogContext, true),\n            child: Text(settings.t('clearHistory')),\n          ),\n        ],\n      ),\n    );\n    if (confirmed == true) await history.clear();\n  }\n\n""",
          )
          replace_once(
              'app/lib/screens/history_screen.dart',
              """              onPressed: history.clear,\n""",
              """              onPressed: () => _confirmClear(context, settings, history),\n""",
          )

          # Preset list summaries use the same localized geo labels as cards/details.
          replace_once(
              'app/lib/screens/presets_screen.dart',
              """    final theme = Theme.of(context);\n    return Card(\n""",
              """    final theme = Theme.of(context);\n    final appState = context.watch<AppState>();\n    final countryCode = preset.filters.countries.isEmpty\n        ? null\n        : preset.filters.countries.first;\n    final country = countryCode == null ? null : appState.countryByCode(countryCode);\n    return Card(\n""",
          )
          replace_once(
              'app/lib/screens/presets_screen.dart',
              """                        _filterSummary(preset.filters, settings),\n""",
              """                        _filterSummary(preset.filters, settings, country),\n""",
          )
          replace_once(
              'app/lib/screens/presets_screen.dart',
              """  String _filterSummary(Filters f, SettingsState s) {\n    final parts = <String>[];\n    if (f.city.isNotEmpty) parts.add(f.city);\n    if (f.district.isNotEmpty) parts.add(f.district);\n    if (f.microdistrict.isNotEmpty) parts.add(f.microdistrict);\n""",
              """  String _filterSummary(Filters f, SettingsState s, Country? country) {\n    final parts = <String>[];\n    if (f.city.isNotEmpty) parts.add(country?.cityLabel(f.city) ?? f.city);\n    if (f.district.isNotEmpty) {\n      parts.add(\n        country?.locationLabel(f.city, f.district, kind: 'district') ?? f.district,\n      );\n    }\n    if (f.microdistrict.isNotEmpty) {\n      parts.add(\n        country?.locationLabel(\n              f.city,\n              f.microdistrict,\n              kind: 'microdistrict',\n            ) ??\n            f.microdistrict,\n      );\n    }\n""",
          )

          # Localization for visible controls and destructive confirmation.
          p = Path('app/lib/l10n/strings.dart')
          text = p.read_text()
          text = text.replace(
              """      'clearHistory': 'Clear history',\n""",
              """      'clearHistory': 'Clear history',\n      'clearHistoryConfirm': 'Are you sure you want to clear history?',\n""",
              1,
          )
          text = text.replace(
              """      'clearHistory': 'Очистить историю',\n""",
              """      'clearHistory': 'Очистить историю',\n      'clearHistoryConfirm': 'Вы уверены, что хотите очистить историю?',\n""",
              1,
          )
          text = text.replace(
              """      'collapseFilters': 'Collapse filters',\n      'expandFilters': 'Expand filters',\n""",
              """      'collapseFilters': 'Collapse filters',\n      'expandFilters': 'Expand filters',\n      'hideFilters': 'Hide',\n      'showFilters': 'Show',\n""",
              1,
          )
          text = text.replace(
              """      'collapseFilters': 'Свернуть фильтры',\n      'expandFilters': 'Развернуть фильтры',\n""",
              """      'collapseFilters': 'Свернуть фильтры',\n      'expandFilters': 'Развернуть фильтры',\n      'hideFilters': 'Скрыть',\n      'showFilters': 'Показать',\n""",
              1,
          )
          p.write_text(text)

          # APK version for this user-visible batch.
          replace_once('app/pubspec.yaml', 'version: 1.0.0+38', 'version: 1.0.0+39')

          # Flutter regression for stringified/object metro names.
          Path('app/test/listing_location_test.dart').write_text("""import 'package:flutter_test/flutter_test.dart';\nimport 'package:flat_finder/models/listing.dart';\n\nvoid main() {\n  test('listing unwraps structured and stringified metro names', () {\n    final structured = Listing.fromJson({\n      'id': '1',\n      'source': 'telegram',\n      'country': 'UZ',\n      'title': 'Flat',\n      'metro': {'name': 'Novza', 'line': 'Chilanzar'},\n      'city': 'Tashkent',\n    });\n    expect(structured.metro, 'Novza');\n\n    final encoded = Listing.fromJson({\n      'id': '2',\n      'source': 'telegram',\n      'country': 'UZ',\n      'title': 'Flat',\n      'metro': '{\"name\":\"Novza\",\"line\":\"Chilanzar\"}',\n      'city': 'Tashkent',\n    });\n    expect(encoded.metro, 'Novza');\n  });\n}\n""")
          PY

          dart format \
            app/lib/state/app_state.dart \
            app/lib/models/listing.dart \
            app/lib/screens/home_screen.dart \
            app/lib/screens/listing_detail.dart \
            app/lib/state/presets.dart \
            app/lib/widgets/filter_sheet.dart \
            app/lib/screens/history_screen.dart \
            app/lib/screens/presets_screen.dart \
            app/lib/l10n/strings.dart \
            app/test/listing_location_test.dart

      - name: Validate backend
        shell: bash
        run: |
          npm ci --prefix backend --no-audit --no-fund
          find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run migrate --prefix backend
          TEST_POSTGRES_SEARCH=1 node --test backend/test/postgres-search.integration.test.js
          npm test --prefix backend

      - name: Validate Flutter
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/src/postgres-search.js \
            backend/src/listing-enrichment.js \
            backend/src/catalog-routes.js \
            backend/test/postgres-search.integration.test.js \
            app/lib/state/app_state.dart \
            app/lib/models/listing.dart \
            app/lib/screens/home_screen.dart \
            app/lib/screens/listing_detail.dart \
            app/lib/state/presets.dart \
            app/lib/widgets/filter_sheet.dart \
            app/lib/screens/history_screen.dart \
            app/lib/screens/presets_screen.dart \
            app/lib/l10n/strings.dart \
            app/pubspec.yaml \
            app/test/listing_location_test.dart
          git commit -m "fix(app): tighten rental and mobile filter UX"
          git push origin HEAD:fix/mobile-ui-followup-20260830
