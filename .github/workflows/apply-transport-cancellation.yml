name: Apply transport cancellation fixes

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-transport-cancellation.py'
      - '.github/workflows/apply-transport-cancellation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Apply transport patch
        run: python3 .github/scripts/apply-transport-cancellation.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/services/request_cancellation.dart app/lib/services/api_service_base.dart app/lib/state/app_state.dart app/lib/screens/listing_detail.dart app/test/translation_cancellation_test.dart
          git commit -m 'fix(app): cancel translation polling on dispose'
          git push origin HEAD:develop
