name: Apply input height and header icon adjustment

on:
  push:
    branches: [ master ]
    paths:
      - .github/scripts/apply-input-height-header-icons.py
      - .github/workflows/apply-input-height-header-icons.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply-input-height-header-icons.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Verify Flutter
        working-directory: app
        run: |
          flutter pub get
          dart format lib/widgets/searchable_dropdown.dart lib/screens/home_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-input-height-header-icons.py .github/workflows/apply-input-height-header-icons.yml
          git add app/lib/widgets/searchable_dropdown.dart app/lib/screens/home_screen.dart
          git diff --cached --check
          git commit -m "fix(app): align input heights and enlarge header icons"
          git push origin master
