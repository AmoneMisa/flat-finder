name: Migrate housing text parsers once

on:
  push:
    branches:
      - refactor/shared-housing-text

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-housing-text
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update package and delegate parsers
        working-directory: backend
        run: |
          npm install @whiteslove/parsing-lexicon@0.2.3 --save-exact --ignore-scripts --no-audit --no-fund
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/textparse-legacy.js')
          s = p.read_text()
          start = s.index('const ok10 =')
          end = s.index('export function parseAreaFromText')
          s = s[:start] + s[end:]
          p.write_text(s)

          p = Path('src/textparse.js')
          s = p.read_text()
          needle = "export { looksCommercialHousing as looksCommercial } from '@whiteslove/parsing-lexicon/housing-commercial';\n"
          insert = needle + "export {\n  parseHousingRoomCount as parseRoomsFromText,\n  parseHousingResidentialComplex as parseResidentialComplex,\n} from '@whiteslove/parsing-lexicon/housing-text';\n"
          if needle not in s:
              raise SystemExit('textparse facade anchor not found')
          p.write_text(s.replace(needle, insert, 1))
          PY
      - name: Validate consumer contracts
        working-directory: backend
        run: |
          node --check src/textparse-legacy.js
          node --check src/textparse.js
          node --test test/textparse.test.js test/uzbek-listing.test.js test/no-makler.test.js
          npm test
      - name: Commit migration
        run: |
          git rm .github/workflows/migrate-housing-text-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json backend/src/textparse-legacy.js backend/src/textparse.js
          git commit -m 'Delegate housing text parsers to parsing package'
          git push origin HEAD:refactor/shared-housing-text
