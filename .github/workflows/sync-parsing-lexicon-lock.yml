name: Sync parsing lexicon lockfile

on:
  push:
    branches: [ feat/shared-parsing-lexicon ]
    paths:
      - backend/package.json
      - .github/workflows/sync-parsing-lexicon-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate backend lockfile only
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          git commit -m 'chore: sync parsing lexicon lockfile'
          git push origin HEAD:feat/shared-parsing-lexicon
