name: Refresh parsing package lock

on:
  push:
    branches:
      - fix/location-price-regressions

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-price-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh backend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json
          git commit -m "Refresh parsing lexicon lockfile"
          git push origin HEAD:fix/location-price-regressions
