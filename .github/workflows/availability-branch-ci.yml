name: Verify listing availability checks

on:
  push:
    branches: [ feat/listing-availability-checks ]
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/src/availability.js'
      - 'backend/src/availability-routes.js'
      - 'backend/src/bootstrap.js'
      - 'backend/test/availability.integration.test.js'
      - 'olx-fetcher/app.py'
      - 'olx-fetcher/test_app.py'
      - '.github/workflows/availability-branch-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flatfinder
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: flatfinder
      POSTGRES_USER: flatfinder
      POSTGRES_PASSWORD: flatfinder-test
      TEST_POSTGRES_SEARCH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install OLX fetcher dependencies
        run: python -m pip install -r olx-fetcher/requirements.txt
      - name: Syntax checks
        run: |
          node --check backend/src/availability.js
          node --check backend/src/availability-routes.js
          node --check backend/src/bootstrap.js
          python -m py_compile olx-fetcher/app.py
      - name: Test OLX status classifier
        run: cd olx-fetcher && python -m unittest -v test_app.py
      - name: Test PostgreSQL availability cache
        run: node --test backend/test/availability.integration.test.js
