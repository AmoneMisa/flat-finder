name: Finalize compact map point integration

on:
  push:
    branches:
      - perf/flutter-map-point-model

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/flutter-map-point-model
      - name: Clean generated MapView code and temporary patchers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/lib/widgets/map_view.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace('final located = widget.listings.where((l) => true).toList();', 'final located = widget.listings;', 1)
          text = text.replace('final located =\n        widget.listings.where((listing) => true).toList();', 'final located = widget.listings;', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/scripts/apply-map-point-model.py
          rm -f .github/workflows/apply-map-point-model.yml
          rm -f .github/workflows/finalize-map-point-model.yml
      - name: Commit final product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib .github
          git commit -m 'chore: finalize compact map point diff'
          git push
