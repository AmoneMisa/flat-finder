class _RadialClusterMarker extends StatelessWidget {
  const _RadialClusterMarker({
    required this.items,
    required this.pageIndex,
    required this.pageCount,
    required this.rates,
    required this.displayCurrency,
    required this.onTapListing,
    required this.onClose,
    this.onPrev,
    this.onNext,
  });

  final List<Listing> items;
  final int pageIndex;
  final int pageCount;
  final Map<String, double>? rates;
  final String? displayCurrency;
  final void Function(Listing) onTapListing;
  final VoidCallback onClose;
  final VoidCallback? onPrev;
  final VoidCallback? onNext;

  @override
  Widget build(BuildContext context) {
    const size = 280.0;
    const center = size / 2;
    final radius = items.length <= 4 ? 72.0 : 94.0;
    return SizedBox(
      width: size,
      height: size,
      child: Stack(
        clipBehavior: Clip.none,
        children: [
          for (var i = 0; i < items.length; i++)
            () {
              final angle =
                  (-90 + (360 / math.max(1, items.length)) * i) *
                  math.pi /
                  180;
              return Positioned(
                left: center + math.cos(angle) * radius - 38,
                top: center + math.sin(angle) * radius - 32,
                child: _RadialTab(
                  listing: items[i],
                  rates: rates,
                  displayCurrency: displayCurrency,
                  onTap: () => onTapListing(items[i]),
                ),
              );
            }(),
          Positioned(
            left: center - 26,
            top: center - 26,
            child: _RadialHub(
              label: '${pageIndex + 1}/$pageCount',
              onClose: onClose,
              onPrev: onPrev,
              onNext: onNext,
            ),
          ),
        ],
      ),
    );
  }
}

class _RadialHub extends StatelessWidget {
  const _RadialHub({
    required this.label,
    required this.onClose,
    this.onPrev,
    this.onNext,
  });

  final String label;
  final VoidCallback onClose;
  final VoidCallback? onPrev;
  final VoidCallback? onNext;

  @override
  Widget build(BuildContext context) {
    final color = Theme.of(context).colorScheme.primary;
    return Container(
      width: 52,
      height: 52,
      decoration: BoxDecoration(
        color: color,
        shape: BoxShape.circle,
        border: Border.all(color: Colors.white, width: 2),
        boxShadow: const [BoxShadow(color: Colors.black45, blurRadius: 8)],
      ),
      clipBehavior: Clip.antiAlias,
      child: Row(
        children: [
          _RadialArrow(icon: Icons.chevron_left, onTap: onPrev),
          Expanded(
            child: GestureDetector(
              behavior: HitTestBehavior.opaque,
              onTap: onClose,
              child: Center(
                child: Text(
                  label,
                  style: const TextStyle(
                    color: Colors.white,
                    fontSize: 9,
                    fontWeight: FontWeight.w800,
                  ),
                ),
              ),
            ),
          ),
          _RadialArrow(icon: Icons.chevron_right, onTap: onNext),
        ],
      ),
    );
  }
}

class _RadialArrow extends StatelessWidget {
  const _RadialArrow({required this.icon, this.onTap});
  final IconData icon;
  final VoidCallback? onTap;

  @override
  Widget build(BuildContext context) {
    return Opacity(
      opacity: onTap == null ? 0.35 : 1,
      child: GestureDetector(
        behavior: HitTestBehavior.opaque,
        onTap: onTap,
        child: SizedBox(
          width: 15,
          height: 52,
          child: Icon(icon, size: 20, color: Colors.white),
        ),
      ),
    );
  }
}

class _RadialTab extends StatelessWidget {
  const _RadialTab({
    required this.listing,
    required this.rates,
    required this.displayCurrency,
    required this.onTap,
  });

  final Listing listing;
  final Map<String, double>? rates;
  final String? displayCurrency;
  final VoidCallback onTap;

  @override
  Widget build(BuildContext context) {
    final scheme = Theme.of(context).colorScheme;
    final photo = listing.photo ??
        (listing.photos.isNotEmpty ? listing.photos.first : null);
    final price = pinPriceLabel(
      listing,
      rates: rates,
      displayCurrency: displayCurrency,
    );
    return Material(
      color: scheme.surface,
      borderRadius: BorderRadius.circular(7),
      clipBehavior: Clip.antiAlias,
      elevation: 6,
      child: InkWell(
        onTap: onTap,
        child: SizedBox(
          width: 76,
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              SizedBox(
                width: 76,
                height: 46,
                child: photo == null
                    ? Icon(
                        Icons.home_outlined,
                        color: scheme.onSurfaceVariant.withValues(alpha: 0.45),
                      )
                    : CachedNetworkImage(
                        imageUrl: photo,
                        fit: BoxFit.cover,
                        placeholder: (_, __) => ColoredBox(
                          color: scheme.surfaceContainerHighest,
                        ),
                        errorWidget: (_, __, ___) => Icon(
                          Icons.home_outlined,
                          color: scheme.onSurfaceVariant.withValues(alpha: 0.45),
                        ),
                      ),
              ),
              SizedBox(
                height: 18,
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 4),
                  child: Center(
                    child: Text(
                      price,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(
                        fontSize: 10,
                        fontWeight: FontWeight.w600,
                      ),
                    ),
                  ),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
