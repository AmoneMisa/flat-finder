              """                children: [\n                  if (_zones.cityZone?.boundaryRings.isNotEmpty == true)\n                    _ZoneToggle(\n                      label: s.t('city'),\n                      active: _showCity,\n                      onTap: () => setState(() => _showCity = !_showCity),\n                    ),\n                  if (_zones.districtZones.isNotEmpty)\n                    _ZoneToggle(""",
