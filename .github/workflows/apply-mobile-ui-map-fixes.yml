name: Apply mobile UI and map parity fixes

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-mobile-ui-map-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/apply_mobile_ui_map_fixes.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Format
        run: |
          dart format \
            app/lib/widgets/searchable_dropdown.dart \
            app/lib/widgets/filter_sheet.dart \
            app/lib/widgets/listing_card.dart \
            app/lib/widgets/map_view.dart \
            app/lib/screens/home_screen.dart \
            app/lib/state/settings.dart

      - name: Verify Flutter app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit validated app changes
        run: |
          rm .github/apply_mobile_ui_map_fixes.py
          rm .github/workflows/apply-mobile-ui-map-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(app): align mobile filters cards and map with web"
          git push origin HEAD:master
