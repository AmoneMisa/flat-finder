              """                          decoration: InputDecoration(\n                            labelText: '+ ${s.t('max')}',\n                            prefixText: '+ ',\n                            border: const OutlineInputBorder(),\n                          ),""",
              """                          decoration: InputDecoration(\n                            labelText: '+ ${s.t('max')}',\n                            hintText: '100',\n                            prefixText: '+ ',\n                            border: const OutlineInputBorder(),\n                          ),""",
              "price tolerance placeholder",
          )
          write(path, text)

          # Listing card actions: smaller button surface, larger icon glyph.
          path = "app/lib/widgets/listing_card.dart"
          text = read(path)
          action_start = "    final actions = Row("
          action_end = "\n\n    return Card("
          action_replacement = """    final actions = Row(\n      mainAxisSize: MainAxisSize.min,\n      children: [\n        if (onShowOnMap != null && listing.hasLocation) ...[\n          _CardActionButton(\n            icon: Icons.pin_drop_outlined,\n            tooltip: s.t('showOnMap'),\n            onPressed: onShowOnMap,\n          ),\n          const SizedBox(width: 4),\n        ],\n        _CardActionButton(\n          icon: isHidden\n              ? Icons.visibility_outlined\n              : Icons.visibility_off_outlined,\n          tooltip: isHidden ? s.t('restoreListing') : s.t('hideListing'),\n          onPressed: () => hidden.toggle(listing),\n        ),\n        const SizedBox(width: 4),\n        _FavButton(\n          isFav: isFav,\n          tooltip: isFav ? s.t('removeFavorite') : s.t('addFavorite'),\n          onPressed: () => favorites.toggle(listing),\n        ),\n      ],\n    );"""
          text = replace_between(text, action_start, action_end, action_replacement, "card actions row")
          buttons_start = "class _FavButton extends StatelessWidget {"
          buttons_end = "/// Deal-type label on the photo's top-left corner"
          buttons_replacement = """class _FavButton extends StatelessWidget {\n  const _FavButton({\n    required this.isFav,\n    required this.tooltip,\n    required this.onPressed,\n  });\n\n  final bool isFav;\n  final String tooltip;\n  final VoidCallback onPressed;\n\n  @override\n  Widget build(BuildContext context) {\n    final scheme = Theme.of(context).colorScheme;\n    return Material(\n      color: scheme.surfaceContainerHighest,\n      borderRadius: BorderRadius.circular(7),\n      clipBehavior: Clip.antiAlias,\n      child: IconButton(\n        tooltip: tooltip,\n        iconSize: 18,\n        visualDensity: VisualDensity.compact,\n        padding: EdgeInsets.zero,\n        constraints: const BoxConstraints.tightFor(width: 28, height: 28),\n        onPressed: onPressed,\n        icon: Icon(\n          isFav ? Icons.favorite : Icons.favorite_border,\n          color: isFav ? Colors.redAccent : scheme.onSurfaceVariant,\n        ),\n      ),\n    );\n  }\n}\n\nclass _CardActionButton extends StatelessWidget {\n  const _CardActionButton({\n    required this.icon,\n    required this.tooltip,\n    required this.onPressed,\n  });\n\n  final IconData icon;\n  final String tooltip;\n  final VoidCallback? onPressed;\n\n  @override\n  Widget build(BuildContext context) {\n    final scheme = Theme.of(context).colorScheme;\n    return Material(\n      color: scheme.surfaceContainerHighest,\n      borderRadius: BorderRadius.circular(7),\n      clipBehavior: Clip.antiAlias,\n      child: IconButton(\n        tooltip: tooltip,\n        iconSize: 18,\n        visualDensity: VisualDensity.compact,\n        padding: EdgeInsets.zero,\n        constraints: const BoxConstraints.tightFor(width: 28, height: 28),\n        onPressed: onPressed,\n        icon: Icon(icon, color: scheme.onSurfaceVariant),\n      ),\n    );\n  }\n}\n\n"""
          text = replace_between(text, buttons_start, buttons_end, buttons_replacement, "card action widgets")
          write(path, text)

          # Map: port the Personal Site behavior instead of approximating it.
          # - screen/Web-Mercator 38px clustering
          # - 16px single point / 32px count cluster
          # - click cluster => fit real bounds up to zoom 19
          # - radial photo carousel only at max zoom or identical coordinates
          # - 9 items/page and auto fit-to-feed at max zoom 14
          path = "app/lib/widgets/map_view.dart"
          text = read(path)
          text = replace_once(
              text,
              """import 'package:flutter/material.dart';""",
              """import 'package:cached_network_image/cached_network_image.dart';\nimport 'package:flutter/material.dart';""",
              "map cached image import",
          )
          text = replace_once(
              text,
              """import '../utils/format.dart';\nimport '../utils/price_tone.dart';""",
              """import '../utils/format.dart';""",
              "map remove price tone import",
          )
          text = replace_once(
              text,
              """  // Which page of price pins is showing for each clustered pin group.\n  static const _pageSize = 8;\n  final Map<String, int> _groupPage = {};\n\n  double _zoom = 6;""",
              """  // Personal Site parity: cluster markers within 38 screen pixels, and\n  // only fan coincident/max-zoom clusters into the radial card browser.\n  static const _pageSize = 9;\n  static const _clusterRadiusPx = 38.0;\n  static const _clusterZoomMax = 19.0;\n  final Map<String, int> _groupPage = {};\n\n  double _zoom = 6;\n  String _lastFitSignature = '';""",
              "map clustering fields",
          )
          text = replace_once(
              text,
              """  bool _showDistricts = true;\n  bool _showMicrodistricts = false;\n  bool _showQuartals = false;\n  bool _showAreas = true;""",
              """  bool _showCity = true;\n  bool _showDistricts = true;\n  bool _showMicrodistricts = false;\n  bool _showQuartals = false;\n  bool _showAreas = true;""",
              "map city toggle field",
          )
          text = replace_once(
              text,
              """  void initState() {\n    super.initState();\n    _zoom = widget.centerZoom;\n    _loadZones();\n  }""",
              """  void initState() {\n    super.initState();\n    _zoom = widget.centerZoom;\n    _loadZones();\n    _scheduleFitToPoints();\n  }""",
              "map init fit",
          )
          text = replace_once(
              text,
              """    // A selected city must open at city scale, not at the country's capital\n    // zoom. A focused listing keeps its explicit close zoom.\n    if (zones.cityZone != null && widget.centerZoom < 10) {\n      _controller.move(LatLng(zones.cityZone!.lat, zones.cityZone!.lng), 11.5);\n    }""",
              """    // The web map fits the actual map feed first. Only use the city\n    // centroid when there are no located results to fit.\n    if (zones.cityZone != null &&\n        widget.centerZoom < 10 &&\n        _visible.isEmpty) {\n      _controller.move(LatLng(zones.cityZone!.lat, zones.cityZone!.lng), 11.5);\n    }""",
              "map city fallback",
          )
          text = replace_once(
              text,
              """  void didUpdateWidget(covariant MapView old) {\n    super.didUpdateWidget(old);\n    // Recenter when the country selection changes the center noticeably.\n    if (old.center != widget.center) {\n      _controller.move(widget.center, widget.centerZoom);\n    }\n    if (old.country != widget.country || old.city != widget.city) {\n      _selectedDistrictId = null;\n      _zones = const MapZones();\n      _loadZones();\n    }\n  }""",
              """  void didUpdateWidget(covariant MapView old) {\n    super.didUpdateWidget(old);\n    if (old.center != widget.center || old.centerZoom != widget.centerZoom) {\n      _controller.move(widget.center, widget.centerZoom);\n    }\n    final geographyChanged =\n        old.country != widget.country || old.city != widget.city;\n    if (geographyChanged) {\n      _selectedDistrictId = null;\n      _zones = const MapZones();\n      _loadZones();\n    }\n    if (geographyChanged || !identical(old.listings, widget.listings)) {\n      _scheduleFitToPoints();\n    }\n  }""",
              "map update behavior",
          )

          cluster_start = "  /// Approximate meters per screen pixel"
          cluster_end = "  void _onMapTap(LatLng point) {"
          cluster_replacement = r'''  bool get _isFocused => widget.centerZoom >= 17.5;

  String _listingKey(Listing listing) =>
      '${listing.source}:${listing.country}:${listing.id}';

  void _scheduleFitToPoints() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (mounted) _fitToPoints();
    });
  }

  /// Same initial framing as Personal Site's `fitToPoints`: all points from
  /// the compact map feed determine the viewport, capped at city-level zoom.
  void _fitToPoints() {
    if (_isFocused) return;
    final located = widget.listings.where((listing) => listing.hasLocation).toList();
    if (located.isEmpty) return;
    final keys = located.map(_listingKey).toList()..sort();
    final signature = keys.join(',');
    if (signature == _lastFitSignature) return;
    try {
      _controller.fitCamera(
        CameraFit.bounds(
          bounds: LatLngBounds.fromPoints([
            for (final listing in located) LatLng(listing.lat!, listing.lng!),
          ]),
          padding: const EdgeInsets.all(30),
          maxZoom: 14,
        ),
      );
      _lastFitSignature = signature;
    } catch (_) {
      // Controller may not be attached during the first frame; a later feed
      // update/rebuild retries naturally without taking the map down.
    }
  }

  Offset _worldPixel(LatLng point) {
    final worldSize = 256.0 * math.pow(2, _zoom).toDouble();
    final lat = point.latitude.clamp(-85.05112878, 85.05112878).toDouble();
    final sinLat = math.sin(lat * math.pi / 180);
    final x = (point.longitude + 180) / 360 * worldSize;
    final y =
        (0.5 - math.log((1 + sinLat) / (1 - sinLat)) / (4 * math.pi)) *
        worldSize;
    return Offset(x, y);
  }

  /// Greedy screen-distance clustering copied from FlatMap.client.vue. The
  /// previous degree-grid approximation could split visually overlapping
  /// points into different cells and merge points that were not actually
  /// close on screen.
  List<_PinGroup> _groupsFor(List<Listing> located) {
    if (located.isEmpty) return const [];
    final worldSize = 256.0 * math.pow(2, _zoom).toDouble();
    final clusters = <_ClusterAccumulator>[];
    for (final listing in located) {
      final point = _worldPixel(LatLng(listing.lat!, listing.lng!));
      _ClusterAccumulator? target;
      for (final cluster in clusters) {
        var dx = (cluster.x - point.dx).abs();
        dx = math.min(dx, worldSize - dx);
        final dy = cluster.y - point.dy;
        if (dx * dx + dy * dy <= _clusterRadiusPx * _clusterRadiusPx) {
          target = cluster;
          break;
        }
      }
      if (target == null) {
        clusters.add(
          _ClusterAccumulator(
            x: point.dx,
            y: point.dy,
            latSum: listing.lat!,
            lngSum: listing.lng!,
            listings: [listing],
          ),
        );
      } else {
        target.listings.add(listing);
        target.latSum += listing.lat!;
        target.lngSum += listing.lng!;
      }
    }

    return [
      for (final cluster in clusters)
        () {
          final keys = cluster.listings.map(_listingKey).toList()..sort();
          return _PinGroup(
            keys.join('|'),
            cluster.listings,
            LatLng(
              cluster.latSum / cluster.listings.length,
              cluster.lngSum / cluster.listings.length,
            ),
          );
        }(),
    ];
  }

  String? _expandedGroupKey;

  bool _hasRealSpread(_PinGroup group) {
    final first = group.listings.first;
    return group.listings.skip(1).any(
      (listing) => listing.lat != first.lat || listing.lng != first.lng,
    );
  }

  void _openGroup(_PinGroup group) {
    if (group.listings.length == 1) {
      widget.onTapListing(group.listings.first);
      return;
    }
    if (_hasRealSpread(group) && _zoom < _clusterZoomMax - 0.01) {
      setState(() => _expandedGroupKey = null);
      try {
        _controller.fitCamera(
          CameraFit.bounds(
            bounds: LatLngBounds.fromPoints([
              for (final listing in group.listings)
                LatLng(listing.lat!, listing.lng!),
            ]),
            padding: const EdgeInsets.all(40),
            maxZoom: _clusterZoomMax,
          ),
        );
      } catch (_) {}
      return;
    }
    setState(() {
      _expandedGroupKey = group.key;
      _groupPage[group.key] = 0;
    });
  }

  List<Marker> _markersForGroup(_PinGroup group) {
    final multi = group.listings.length > 1;
    final size = multi ? 32.0 : 16.0;
    return [
      Marker(
        point: group.point,
        width: size,
        height: size,
        child: GestureDetector(
          behavior: HitTestBehavior.opaque,
          onTap: () => _openGroup(group),
          child: _ClusterDot(count: group.listings.length),
        ),
      ),
    ];
  }

  _PinGroup? _expandedGroup(List<_PinGroup> groups) {
    final key = _expandedGroupKey;
    if (key == null) return null;
    for (final group in groups) {
      if (group.key == key) return group;
    }
    return null;
  }

  Marker _radialMarkerForGroup(_PinGroup group) {
    final pageCount = (group.listings.length / _pageSize).ceil();
    final current = _groupPage[group.key] ?? 0;
    final pageIndex = current % pageCount;
    final start = pageIndex * _pageSize;
    final end = math.min(start + _pageSize, group.listings.length);
    final page = group.listings.sublist(start, end);
    return Marker(
      point: group.point,
      width: 280,
      height: 280,
      child: _RadialClusterMarker(
        items: page,
        pageIndex: pageIndex,
        pageCount: pageCount,
        rates: widget.rates,
        displayCurrency: widget.displayCurrency,
        onTapListing: widget.onTapListing,
        onClose: () => setState(() => _expandedGroupKey = null),
        onPrev: pageCount <= 1
            ? null
            : () => setState(
                  () => _groupPage[group.key] =
                      (pageIndex - 1 + pageCount) % pageCount,
                ),
        onNext: pageCount <= 1
            ? null
            : () => setState(
                  () => _groupPage[group.key] = (pageIndex + 1) % pageCount,
                ),
      ),
    );
  }

'''
