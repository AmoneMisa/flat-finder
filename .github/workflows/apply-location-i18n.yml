name: Apply lexicon location localization

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/apply-location-i18n.yml
      - .github/scripts/apply-location-i18n.py
      - .github/scripts/apply-mobile-polish.py
      - .github/scripts/apply-stats-percent.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-location-i18n.py')
          text = path.read_text()
          text = text.replace(
              're.subn(pattern, repl, text, count=1, flags=flags)',
              're.subn(pattern, lambda _match: repl, text, count=1, flags=flags)',
              1,
          )
          path.write_text(text)
          PY
          python3 .github/scripts/apply-location-i18n.py
          python3 .github/scripts/apply-mobile-polish.py
          python3 .github/scripts/apply-stats-percent.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Format Flutter
        working-directory: app
        run: dart format lib

      - name: Verify Flutter
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm test --prefix backend

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-location-i18n.py .github/scripts/apply-mobile-polish.py .github/scripts/apply-stats-percent.py .github/workflows/apply-location-i18n.yml
          git add app backend
          git diff --cached --check
          git commit -m "fix(app): localize geography, tighten mobile UI, show deal shares"
          git push origin master
