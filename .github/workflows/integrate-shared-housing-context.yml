name: Integrate shared housing context

on:
  push:
    branches:
      - feat/shared-parsing-lexicon
    paths:
      - .github/workflows/integrate-shared-housing-context.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-parsing-lexicon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate shared housing semantics
        run: python .github/scripts/integrate-shared-housing-context.py
      - name: Commit phase
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/normalize.js backend/src/postgres-search.js backend/test/housing-context-integration.test.js
          if git diff --cached --quiet; then
            echo 'No consumer changes to commit'
            exit 0
          fi
          git commit -m 'feat(housing): persist shared intent and context'
          git push origin HEAD:feat/shared-parsing-lexicon
