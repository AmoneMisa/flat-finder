name: Apply map accessibility fixes

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-map-accessibility.py'
      - '.github/workflows/apply-map-accessibility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Apply accessibility patch
        run: python3 .github/scripts/apply-map-accessibility.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/widgets/map_view.dart app/lib/l10n/review_strings.dart app/test/accessibility_l10n_test.dart
          git commit -m 'fix(app): make map controls accessible'
          git push origin HEAD:develop
