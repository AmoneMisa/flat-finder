name: Apply walking metro distance

on:
  push:
    branches: [ feat/walking-distance-to-metro ]
    paths:
      - '.github/scripts/apply-walking-metro-distance.py'
      - '.github/workflows/apply-walking-metro-distance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        run: python .github/scripts/apply-walking-metro-distance.py

      - name: Commit patched app files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/models/listing.dart app/lib/screens/listing_detail.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(app): show walking distance to metro'
          git push origin HEAD:feat/walking-distance-to-metro
