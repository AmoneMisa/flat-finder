name: Cleanup country geo comment once
on:
  push:
    branches: [fix/country-geo-ownership-safe9]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/country-geo-ownership-safe9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/cleanup_country_geo_comment.mjs
      - run: node --check backend/src/countries.js
      - name: Commit clean source-only change
        run: |
          rm -f .github/scripts/cleanup_country_geo_comment.mjs
          rm -f .github/workflows/cleanup-country-geo-comment-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/countries.js .github/scripts/cleanup_country_geo_comment.mjs .github/workflows/cleanup-country-geo-comment-once.yml
          git commit -m "Clean country geography source config"
          git push origin HEAD:fix/country-geo-ownership-safe9
