name: Apply compact filter spacing

on:
  push:
    branches: [ master ]
    paths:
      - .github/scripts/apply-filter-spacing.py
      - .github/workflows/apply-filter-spacing.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply spacing patch
        run: python3 .github/scripts/apply-filter-spacing.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Verify Flutter
        working-directory: app
        run: |
          flutter pub get
          dart format lib/widgets/filter_sheet.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-filter-spacing.py .github/workflows/apply-filter-spacing.yml
          git add app/lib/widgets/filter_sheet.dart
          git diff --cached --check
          git commit -m "fix(app): compact filter field spacing"
          git push origin master
