name: Integrate structured housing parser

on:
  push:
    branches:
      - feat/shared-parsing-lexicon
    paths:
      - .github/workflows/integrate-structured-housing.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-parsing-lexicon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate structured housing parser
        run: python .github/scripts/integrate_structured_housing.py
      - name: Commit phase
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/normalize.js
          if git diff --cached --quiet; then
            echo 'No structured housing changes to commit'
            exit 0
          fi
          git commit -m 'refactor(housing): use shared structured extraction'
          git push origin HEAD:feat/shared-parsing-lexicon
