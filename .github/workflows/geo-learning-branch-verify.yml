name: Verify geo learning branch

on:
  push:
    branches:
      - fix/use-geo-catalog-for-coordinates

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flatfinder
          POSTGRES_USER: flatfinder
          POSTGRES_PASSWORD: flatfinder-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatfinder -d flatfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: flatfinder
      POSTGRES_USER: flatfinder
      POSTGRES_PASSWORD: flatfinder-test
      TEST_POSTGRES_URL: postgresql://flatfinder:flatfinder-test@127.0.0.1:5432/flatfinder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/use-geo-catalog-for-coordinates
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify locked dependencies
        run: npm ci --prefix backend

      - name: Install mutable internal packages from master
        run: npm run install:internal --prefix backend

      - name: Check changed JavaScript syntax
        run: |
          node --check backend/src/geo-catalog.js
          node --check backend/src/geocode-persistent.js
          node --check backend/src/learned-geo.js
          node --check backend/src/learned-geo-export.js
          node --check backend/src/structured-address.js

      - name: Apply migrations
        run: npm run migrate --prefix backend

      - name: Run geo regressions
        run: >-
          node --test
          backend/test/learned-geo.test.js
          backend/test/structured-address.test.js
          backend/test/uzbekistan-geo-package.test.js

      - name: Run full backend suite
        run: npm test --prefix backend
