name: Apply deprecated widget migration

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/apply-deprecated-widget-migration.py'
      - '.github/workflows/apply-deprecated-widget-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Apply deprecated widget migration
        run: python3 .github/scripts/apply-deprecated-widget-migration.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/screens/home_screen.dart app/lib/widgets/filter_sheet.dart app/lib/screens/settings_screen.dart app/lib/screens/listing_detail.dart
          git commit -m 'refactor(app): migrate deprecated Flutter widgets'
          git push origin HEAD:develop
