name: Finalize parsing lexicon pin
on:
  push:
    branches: [feat/shared-parsing-lexicon]
    paths: [.github/workflows/finalize-parsing-lexicon-pin.yml]
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-parsing-lexicon
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin package and regenerate backend lockfile
        working-directory: backend
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.dependencies['@whiteslove/parsing-lexicon']='https://github.com/AmoneMisa/parsing-lexicon/archive/ce13f5fdfe51e104f86941d7cfcc6e05747cf22d.tar.gz';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: pin final parsing lexicon package'
          git push
