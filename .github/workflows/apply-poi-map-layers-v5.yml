name: Apply POI consumer patch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_poi.py
          python3 /tmp/apply_poi.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          node --check backend/src/district-zones.js
          node --check backend/src/catalog-routes.js
          node --test backend/test/map-zones-contract.test.js
          npm test --prefix backend
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Verify Flutter
        working-directory: app
        run: |
          dart format lib/models/district_zone.dart lib/widgets/map_view.dart lib/l10n/strings.dart lib/screens/home_screen.dart lib/screens/listing_detail.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit validated patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/district-zones.js backend/src/catalog-routes.js backend/test/map-zones-contract.test.js app/lib/models/district_zone.dart app/lib/widgets/map_view.dart app/lib/l10n/strings.dart app/lib/screens/home_screen.dart app/lib/screens/listing_detail.dart app/pubspec.yaml
          git commit -m 'feat(app): add canonical POI map layers'
          git push origin HEAD:master
