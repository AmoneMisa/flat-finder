name: Verify flat finder feature branch

on:
  push:
    branches: [ feat/map-amenity-filters-sorting ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Syntax check changed backend modules
        run: |
          node --check backend/src/server.js
          node --check backend/src/normalize.js
          node --check backend/src/coordinate-validation.js
          node --check backend/src/queueTasks.js
          node --check backend/src/listing-sort.js
          node --check backend/src/amenity-parse.js
      - name: Run backend tests
        run: npm test --prefix backend
