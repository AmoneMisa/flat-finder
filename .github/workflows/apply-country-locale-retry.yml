name: Apply country locale retry patch

on:
  push:
    branches:
      - fix/flutter-country-locale-retry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-country-locale-retry
      - name: Apply focused AppState patch
        run: python .github/scripts/apply-country-locale-retry.py
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/state/app_state.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix(app): bound country locale retry loop'
          git push
