name: Update parsing lexicon pin once

on:
  push:
    branches: [chore/pin-salary-phone-parser-fix]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pin-salary-phone-parser-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin parser and refresh backend lockfile
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'f246fcb37051e11e3b465e7fa8ac2755f96116d1'
          new = 'f01c9849c9d369c9df165fab2b2d09a38c7e06e2'
          p = Path('backend/package.json')
          s = p.read_text()
          if old not in s:
              raise SystemExit('old parsing-lexicon pin not found')
          p.write_text(s.replace(old, new))
          PY
          cd backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/update-parsing-lexicon-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package.json backend/package-lock.json .github/workflows/update-parsing-lexicon-once.yml
          git commit -m "Pin salary phone parser fix"
          git push origin HEAD:chore/pin-salary-phone-parser-fix
