name: Bootstrap parsing lexicon lockfile

on:
  push:
    branches:
      - feat/shared-parsing-lexicon
    paths:
      - 'backend/package.json'
      - '.github/workflows/bootstrap-parsing-lexicon-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-parsing-lexicon
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --prefix backend
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json
          git diff --cached --quiet || git commit -m 'chore: sync parsing lexicon lockfile'
          git push
