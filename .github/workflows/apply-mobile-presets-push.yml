name: Apply mobile preset push integration

on:
  push:
    branches:
      - feature/mobile-presets-push-20260829
    paths:
      - .github/scripts/apply-mobile-presets-push.py
      - .github/workflows/apply-mobile-presets-push.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-presets-push-20260829
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 .github/scripts/apply-mobile-presets-push.py

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          node --check src/mobile-fcm.js
          node --check src/mobile-subscriptions.js
          npm test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Validate Flutter
        working-directory: app
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated integration
        run: |
          rm -f .github/scripts/apply-mobile-presets-push.py
          rm -f .github/workflows/apply-mobile-presets-push.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(app): add preset housing push notifications"
          git push origin HEAD:feature/mobile-presets-push-20260829
