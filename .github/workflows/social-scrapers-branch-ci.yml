name: Social scrapers CI

on:
  push:
    branches: [ feature/social-scrapers ]
  pull_request:
    branches: [ master ]
    paths:
      - 'social-fetcher/**'
      - 'backend/src/social-routes.js'
      - 'backend/src/social-housing-scheduler.js'
      - 'backend/src/queueTasks.js'
      - 'backend/test/social-housing-lifecycle.test.js'
      - 'backend/test/social-fetch-contracts.test.js'
      - '.github/workflows/social-scrapers-branch-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check social route syntax
        run: |
          node --check backend/src/social-routes.js
          node --check backend/src/social-housing-scheduler.js
          node --check backend/src/queueTasks.js
      - name: Run social backend regressions
        run: >-
          node --test
          backend/test/social-housing-lifecycle.test.js
          backend/test/social-fetch-contracts.test.js

  verify-social-fetcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build social fetcher image and run parser tests
        run: docker build -t flat-finder-social-fetcher:test ./social-fetcher
