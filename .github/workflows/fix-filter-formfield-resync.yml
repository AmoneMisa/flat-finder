name: Fix filter FormField resync

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/fix-filter-formfield-resync.py'
      - '.github/workflows/fix-filter-formfield-resync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Apply FormField resync fix
        run: python3 .github/scripts/fix-filter-formfield-resync.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/widgets/filter_sheet.dart
          git commit -m 'fix(app): resync preset dropdown FormFields'
          git push origin HEAD:develop
