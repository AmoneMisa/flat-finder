name: Apply canonical POI map layers v4

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical POI consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count}, found {found}: {old!r}')
              p.write_text(text.replace(old, new, count))

          if 'final List<DistrictZone> parks;' in Path('app/lib/models/district_zone.dart').read_text():
              print('POI patch already present; nothing to patch.')
              raise SystemExit(0)

          rep('backend/src/district-zones.js',
              '      metroStations: [],\n      cityZone: null,',
              '      metroStations: [],\n      parks: [],\n      shoppingMalls: [],\n      universities: [],\n      cityZone: null,')
          rep('backend/src/district-zones.js',
              "  const cityZone = cityEntity ? zoneFromEntity(cityEntity, 0) : null;",
              """  // Canonical POI identity, coordinates and geometry stay in geo-catalog.
          const parks = descendantsOf(cityId, country, 'poi.park')
            .map((entity, index) => zoneFromEntity(entity, index));
          const shoppingMalls = descendantsOf(cityId, country, 'poi.shopping_mall')
            .map((entity, index) => zoneFromEntity(entity, index));
          const universities = descendantsOf(cityId, country, 'poi.university')
            .map((entity, index) => zoneFromEntity(entity, index));

          const cityZone = cityEntity ? zoneFromEntity(cityEntity, 0) : null;""")
          rep('backend/src/district-zones.js',
              '    metroStations,\n    cityZone,',
              '    metroStations,\n    parks,\n    shoppingMalls,\n    universities,\n    cityZone,')

          rep('backend/src/catalog-routes.js',
              """  const mapGroup = (items, kind) => items.map((zone) => ({
            ...zone,
            label: lexiconLocationLabel(zone.name, locale, kind, countryCode, cityName),
          }));
          return {
            ...zones,
            districtZones:""",
              """  const mapGroup = (items, kind) => items.map((zone) => ({
            ...zone,
            label: lexiconLocationLabel(zone.name, locale, kind, countryCode, cityName),
          }));
          const mapPoiGroup = (items) => items.map((zone) => ({
            ...zone,
            label: geographyDisplayName(zone.name, locale, 'poi') || zone.name,
          }));
          return {
            ...zones,
            districtZones:""")
          rep('backend/src/catalog-routes.js',
              "    metroStations: mapGroup(zones.metroStations || [], 'metro'),\n    cityZone:",
              "    metroStations: mapGroup(zones.metroStations || [], 'metro'),\n    parks: mapPoiGroup(zones.parks || []),\n    shoppingMalls: mapPoiGroup(zones.shoppingMalls || []),\n    universities: mapPoiGroup(zones.universities || []),\n    cityZone:")

          rep('backend/test/map-zones-contract.test.js',
              "  assert.ok(zones.metroStations.every((zone) => Number.isFinite(zone.lat) && Number.isFinite(zone.lng)));",
              """  assert.ok(zones.metroStations.every((zone) => Number.isFinite(zone.lat) && Number.isFinite(zone.lng)));
          assert.ok(Array.isArray(zones.parks));
          assert.ok(Array.isArray(zones.shoppingMalls));
          assert.ok(Array.isArray(zones.universities));
          assert.ok(zones.parks.every((zone) => zone.type === 'poi.park'));
          assert.ok(zones.shoppingMalls.every((zone) => zone.type === 'poi.shopping_mall'));
          assert.ok(zones.universities.every((zone) => zone.type === 'poi.university'));""")
          rep('backend/test/map-zones-contract.test.js',
              '    metroStations: [],\n    cityZone: null,',
              '    metroStations: [],\n    parks: [],\n    shoppingMalls: [],\n    universities: [],\n    cityZone: null,')

          rep('app/lib/models/district_zone.dart',
              '  final List<DistrictZone> metroStations;\n  final DistrictZone? cityZone;',
              '  final List<DistrictZone> metroStations;\n  final List<DistrictZone> parks;\n  final List<DistrictZone> shoppingMalls;\n  final List<DistrictZone> universities;\n  final DistrictZone? cityZone;')
          rep('app/lib/models/district_zone.dart',
              '    this.metroStations = const [],\n    this.cityZone,',
              '    this.metroStations = const [],\n    this.parks = const [],\n    this.shoppingMalls = const [],\n    this.universities = const [],\n    this.cityZone,')
          rep('app/lib/models/district_zone.dart',
              '    yield* metroStations;\n  }',
              '    yield* metroStations;\n    yield* parks;\n    yield* shoppingMalls;\n    yield* universities;\n  }')
          rep('app/lib/models/district_zone.dart',
              "      metroStations: list('metroStations'),\n      cityZone:",
              "      metroStations: list('metroStations'),\n      parks: list('parks'),\n      shoppingMalls: list('shoppingMalls'),\n      universities: list('universities'),\n      cityZone:")

          rep('app/lib/widgets/map_view.dart',
              '  bool _showMetro = false;',
              '  bool _showMetro = false;\n  bool _showParks = false;\n  bool _showShoppingMalls = false;\n  bool _showUniversities = false;')
          rep('app/lib/widgets/map_view.dart',
              "      case 'metro':\n        return 16;",
              "      case 'metro':\n      case 'poi.park':\n      case 'poi.shopping_mall':\n      case 'poi.university':\n        return 16;")
          rep('app/lib/widgets/map_view.dart',
              '    final candidates = <DistrictZone?>[\n      if (_showAreas)',
              '    final candidates = <DistrictZone?>[\n      if (_showParks || _showShoppingMalls || _showUniversities)\n        _hitZone(point, <DistrictZone>[\n          if (_showParks) ..._zones.parks,\n          if (_showShoppingMalls) ..._zones.shoppingMalls,\n          if (_showUniversities) ..._zones.universities,\n        ]),\n      if (_showAreas)')
          rep('app/lib/widgets/map_view.dart',
              '  Polygon _metroRing(DistrictZone station, double radiusM, Color color) {',
              '  Polygon _proximityRing(DistrictZone place, double radiusM, Color color) {')
          rep('app/lib/widgets/map_view.dart',
              '      points: _circleRing(station, radiusM),',
              '      points: _circleRing(place, radiusM),')
          p = Path('app/lib/widgets/map_view.dart')
          p.write_text(p.read_text().replace('_metroRing(station,', '_proximityRing(station,'))
          rep('app/lib/widgets/map_view.dart',
              '  @override\n  Widget build(BuildContext context) {\n    final s = context.watch<SettingsState>().s;',
              """  List<Marker> _poiMarkers(List<DistrictZone> pois, IconData icon) => [
                for (final poi in pois)
                  Marker(
                    point: LatLng(poi.lat, poi.lng),
                    width: 34,
                    height: 34,
                    child: GestureDetector(
                      behavior: HitTestBehavior.opaque,
                      onTap: () => unawaited(_selectZone(poi)),
                      child: _PoiMarker(
                        icon: icon,
                        color: _parseHexColor(poi.colorHex),
                        selected: poi.id == _selectedZoneId,
                      ),
                    ),
                  ),
              ];

          @override
          Widget build(BuildContext context) {
            final s = context.watch<SettingsState>().s;""")
          rep('app/lib/widgets/map_view.dart',
              '            if (_showDistricts && _zones.districtZones.isNotEmpty)\n              MarkerLayer(',
              """            if (_showParks && _zones.parks.isNotEmpty)
              PolygonLayer(
                polygons: [
                  for (final poi in _zones.parks) _proximityRing(poi, 1000, _metro1000Color),
                  for (final poi in _zones.parks) _proximityRing(poi, 500, _metro500Color),
                  for (final poi in _zones.parks) _proximityRing(poi, 200, _metro200Color),
                  for (final poi in _zones.parks)
                    for (final ring in poi.boundaryRings)
                      _zonePolygon(poi, ring, fillAlpha: 0.12),
                ],
              ),
            if (_showShoppingMalls && _zones.shoppingMalls.isNotEmpty)
              PolygonLayer(
                polygons: [
                  for (final poi in _zones.shoppingMalls) _proximityRing(poi, 1000, _metro1000Color),
                  for (final poi in _zones.shoppingMalls) _proximityRing(poi, 500, _metro500Color),
                  for (final poi in _zones.shoppingMalls) _proximityRing(poi, 200, _metro200Color),
                  for (final poi in _zones.shoppingMalls)
                    for (final ring in poi.boundaryRings)
                      _zonePolygon(poi, ring, fillAlpha: 0.10),
                ],
              ),
            if (_showUniversities && _zones.universities.isNotEmpty)
              PolygonLayer(
                polygons: [
                  for (final poi in _zones.universities) _proximityRing(poi, 1000, _metro1000Color),
                  for (final poi in _zones.universities) _proximityRing(poi, 500, _metro500Color),
                  for (final poi in _zones.universities) _proximityRing(poi, 200, _metro200Color),
                  for (final poi in _zones.universities)
                    for (final ring in poi.boundaryRings)
                      _zonePolygon(poi, ring, fillAlpha: 0.10),
                ],
              ),
            if (_showDistricts && _zones.districtZones.isNotEmpty)
              MarkerLayer(""")
          rep('app/lib/widgets/map_view.dart',
              "            if (selectedZone != null && selectedZone.type != 'district')",
              """            if (_showParks && _zones.parks.isNotEmpty)
              MarkerLayer(markers: _poiMarkers(_zones.parks, Icons.park_outlined)),
            if (_showShoppingMalls && _zones.shoppingMalls.isNotEmpty)
              MarkerLayer(markers: _poiMarkers(_zones.shoppingMalls, Icons.local_mall_outlined)),
            if (_showUniversities && _zones.universities.isNotEmpty)
              MarkerLayer(markers: _poiMarkers(_zones.universities, Icons.school_outlined)),
            if (selectedZone != null && selectedZone.type != 'district')""")
          rep('app/lib/widgets/map_view.dart',
              '            _zones.metroStations.isNotEmpty)',
              '            _zones.metroStations.isNotEmpty ||\n            _zones.parks.isNotEmpty ||\n            _zones.shoppingMalls.isNotEmpty ||\n            _zones.universities.isNotEmpty)')
          rep('app/lib/widgets/map_view.dart',
              """                  if (_zones.metroStations.isNotEmpty)
                    _ZoneToggle(
                      label: s.t('metro'),
                      active: _showMetro,
                      onTap: () => setState(() => _showMetro = !_showMetro),
                    ),""",
              """                  if (_zones.metroStations.isNotEmpty)
                    _ZoneToggle(
                      label: s.t('metro'),
                      active: _showMetro,
                      onTap: () => setState(() => _showMetro = !_showMetro),
                    ),
                  if (_zones.parks.isNotEmpty)
                    _ZoneToggle(
                      label: s.t('parks'),
                      active: _showParks,
                      onTap: () => setState(() => _showParks = !_showParks),
                    ),
                  if (_zones.shoppingMalls.isNotEmpty)
                    _ZoneToggle(
                      label: s.t('shoppingMalls'),
                      active: _showShoppingMalls,
                      onTap: () => setState(() => _showShoppingMalls = !_showShoppingMalls),
                    ),
                  if (_zones.universities.isNotEmpty)
                    _ZoneToggle(
                      label: s.t('universities'),
                      active: _showUniversities,
                      onTap: () => setState(() => _showUniversities = !_showUniversities),
                    ),""")
          rep('app/lib/widgets/map_view.dart',
              '        if (_showMetro && _zones.metroStations.isNotEmpty)\n          Positioned(',
              '        if ((_showMetro && _zones.metroStations.isNotEmpty) ||\n            (_showParks && _zones.parks.isNotEmpty) ||\n            (_showShoppingMalls && _zones.shoppingMalls.isNotEmpty) ||\n            (_showUniversities && _zones.universities.isNotEmpty))\n          Positioned(')
          rep('app/lib/widgets/map_view.dart',
              'class _ClusterAccumulator {',
              """class _PoiMarker extends StatelessWidget {
          const _PoiMarker({required this.icon, required this.color, required this.selected});
          final IconData icon;
          final Color color;
          final bool selected;

          @override
          Widget build(BuildContext context) => Container(
                alignment: Alignment.center,
                decoration: BoxDecoration(
                  color: selected ? Theme.of(context).colorScheme.primary : Colors.black.withValues(alpha: 0.78),
                  shape: BoxShape.circle,
                  border: Border.all(color: selected ? Colors.white : color, width: selected ? 2.5 : 2),
                  boxShadow: const [BoxShadow(color: Colors.black38, blurRadius: 3)],
                ),
                child: Icon(icon, size: 18, color: Colors.white),
              );
        }

        class _ClusterAccumulator {""")

          rep('app/lib/l10n/strings.dart', "      'areas': 'Areas',", "      'areas': 'Areas',\n      'parks': 'Parks',\n      'shoppingMalls': 'Malls',\n      'universities': 'Universities',")
          rep('app/lib/l10n/strings.dart', "      'areas': 'Локации',", "      'areas': 'Локации',\n      'parks': 'Парки',\n      'shoppingMalls': 'ТЦ',\n      'universities': 'Университеты',")

          rep('app/lib/screens/home_screen.dart', '      if (full != null) _listing = full!;', '      if (full != null) _listing = full;')
          rep('app/lib/screens/listing_detail.dart', '    this.callingCode,\n', '')
          rep('app/lib/screens/listing_detail.dart', '  final String? callingCode;\n', '')
          rep('app/lib/screens/listing_detail.dart', '  String get _displayContact => _contactWithCountryCode(contact, callingCode);', '  String get _displayContact => contact;')
          rep('app/pubspec.yaml', '    - assets/logo.png\n', '')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          node --check backend/src/district-zones.js
          node --check backend/src/catalog-routes.js
          node --test backend/test/map-zones-contract.test.js
          npm test --prefix backend

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Verify Flutter
        working-directory: app
        run: |
          dart format lib/models/district_zone.dart lib/widgets/map_view.dart lib/l10n/strings.dart lib/screens/home_screen.dart lib/screens/listing_detail.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/district-zones.js backend/src/catalog-routes.js backend/test/map-zones-contract.test.js app/lib/models/district_zone.dart app/lib/widgets/map_view.dart app/lib/l10n/strings.dart app/lib/screens/home_screen.dart app/lib/screens/listing_detail.dart app/pubspec.yaml
          git commit -m 'feat(app): add canonical POI map layers'
          git push origin HEAD:master
