name: Apply compact map point model

on:
  push:
    branches:
      - perf/flutter-map-point-model

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/flutter-map-point-model
      - name: Apply map point integration
        run: python .github/scripts/apply-map-point-model.py
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib
          git diff --cached --quiet && exit 0
          git commit -m 'perf(app): use compact model for map feed'
          git push
