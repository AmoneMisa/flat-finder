# Reverse-proxy for the flat-finder API, running inside the compose stack.
# Listens on port 80 and forwards to the backend container by its service name.
# The app reaches it at http://185.5.206.229 (no port needed).
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://flat-finder-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
