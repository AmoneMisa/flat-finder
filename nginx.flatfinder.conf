# HOST nginx server block for flat-finder (NOT a container).
# Copy to /etc/nginx/sites-available/flat-finder and symlink into sites-enabled,
# or drop into /etc/nginx/conf.d/. Then: nginx -t && systemctl reload nginx.
#
# Serves the API on port 8082 (pick any free public port; 80/443 are used by the
# other project's default site). The app then targets http://185.5.206.229:8082.
server {
    listen 8082;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
